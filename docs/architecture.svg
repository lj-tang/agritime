<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="960" height="640" fill="#f6faf7"/>
  <text x="480" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2a24">知农时 · 四层架构与六步数据流</text>

  <g>
    <rect x="60" y="80" width="840" height="96" rx="12" fill="#ffffff" stroke="#dfe6e1"/>
    <text x="84" y="112" font-size="18" font-weight="700" fill="#2e9e5b">接入层</text>
    <rect x="180" y="96" width="200" height="60" rx="8" fill="#eef7f0"/>
    <text x="280" y="132" text-anchor="middle" font-size="15" fill="#1f2a24">输入表单页</text>
    <rect x="400" y="96" width="200" height="60" rx="8" fill="#eef7f0"/>
    <text x="500" y="132" text-anchor="middle" font-size="15" fill="#1f2a24">时间线展示页</text>
    <rect x="620" y="96" width="200" height="60" rx="8" fill="#eef7f0"/>
    <text x="720" y="132" text-anchor="middle" font-size="15" fill="#1f2a24">拍照识别组件</text>
  </g>

  <g>
    <rect x="60" y="196" width="840" height="96" rx="12" fill="#ffffff" stroke="#dfe6e1"/>
    <text x="84" y="228" font-size="18" font-weight="700" fill="#2e9e5b">编排层</text>
    <rect x="180" y="212" width="200" height="60" rx="8" fill="#eef7f0"/>
    <text x="280" y="248" text-anchor="middle" font-size="15" fill="#1f2a24">时间线 API（六步编排）</text>
    <rect x="400" y="212" width="200" height="60" rx="8" fill="#eef7f0"/>
    <text x="500" y="248" text-anchor="middle" font-size="15" fill="#1f2a24">计算层调度器</text>
    <rect x="620" y="212" width="200" height="60" rx="8" fill="#eef7f0"/>
    <text x="720" y="248" text-anchor="middle" font-size="15" fill="#1f2a24">缓存与降级（800ms）</text>
  </g>

  <g>
    <rect x="60" y="312" width="840" height="128" rx="12" fill="#ffffff" stroke="#dfe6e1"/>
    <text x="84" y="344" font-size="18" font-weight="700" fill="#2e9e5b">计算层</text>
    <text x="84" y="372" font-size="14" fill="#6b7a72">后端 A · 规则与日历</text>
    <rect x="180" y="332" width="200" height="52" rx="8" fill="#eef7f0"/>
    <text x="280" y="364" text-anchor="middle" font-size="14" fill="#1f2a24">节点生成器</text>
    <rect x="180" y="392" width="200" height="40" rx="8" fill="#eef7f0"/>
    <text x="280" y="418" text-anchor="middle" font-size="14" fill="#1f2a24">阈值打分·节气计算</text>
    <text x="420" y="372" font-size="14" fill="#6b7a72">后端 B · 集成与配置</text>
    <rect x="620" y="332" width="200" height="52" rx="8" fill="#eef7f0"/>
    <text x="720" y="364" text-anchor="middle" font-size="14" fill="#1f2a24">天气适配器（MCP）</text>
    <rect x="620" y="392" width="200" height="40" rx="8" fill="#eef7f0"/>
    <text x="720" y="418" text-anchor="middle" font-size="14" fill="#1f2a24">作物识别·节日引擎</text>
  </g>

  <g>
    <rect x="60" y="460" width="840" height="76" rx="12" fill="#ffffff" stroke="#dfe6e1"/>
    <text x="84" y="492" font-size="18" font-weight="700" fill="#2e9e5b">数据层</text>
    <rect x="180" y="472" width="150" height="50" rx="8" fill="#eef7f0"/>
    <text x="255" y="502" text-anchor="middle" font-size="13" fill="#1f2a24">作物农事规程表</text>
    <rect x="342" y="472" width="150" height="50" rx="8" fill="#eef7f0"/>
    <text x="417" y="502" text-anchor="middle" font-size="13" fill="#1f2a24">作业敏感度阈值表</text>
    <rect x="504" y="472" width="150" height="50" rx="8" fill="#eef7f0"/>
    <text x="579" y="502" text-anchor="middle" font-size="13" fill="#1f2a24">节气-农事对应表</text>
    <rect x="666" y="472" width="150" height="50" rx="8" fill="#eef7f0"/>
    <text x="741" y="502" text-anchor="middle" font-size="13" fill="#1f2a24">节日/状态文案表</text>
  </g>

  <g>
    <text x="480" y="572" text-anchor="middle" font-size="15" fill="#1f2a24">六步数据流：收集 → 匹配 → 生成 → 取天气 → 打分 → 叠加提醒</text>
    <text x="480" y="600" text-anchor="middle" font-size="14" fill="#6b7a72">层间仅一份 JSON 契约 · 确定信息实线 / 预测信息虚线 · 天气不可用返回缓存并标注数据时间</text>
  </g>
</svg>