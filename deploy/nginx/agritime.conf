# 线上 nginx 站点配置（/etc/nginx/sites-enabled/agritime 的副本，纳入版本库便于追溯）
# 修改后同步：cp deploy/nginx/agritime.conf /etc/nginx/sites-enabled/agritime && nginx -t && systemctl reload nginx
# 注意：备份文件不要放在 sites-enabled/ 里，nginx 会把该目录下所有文件都加载，造成 server_name 冲突

server {

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    error_page 429 = @rate_limit;
    error_page 404 /404.html;

    listen 80;
    server_name _;

    root /agritime/frontend/pages;
    index index.html;

    # gzip：原先 gzip_types 被注释，实际只压缩了 html，
    # js/css/svg/json 都是明文传输（首页光 js 就有十几个）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    location = /favicon.ico {
        access_log off;
        return 302 /assets/img/common-logo.svg;
    }

    # 证书签发/续期校验路径（备案域名就位后可启用 HTTPS，见 deploy/enable-https.sh）
    location ^~ /.well-known/acme-challenge/ {
        root /agritime/frontend/pages;
        access_log off;
    }

    # 静态资源缓存 5 分钟。
    # 这里用 expires 而不是 add_header Cache-Control：location 里一旦出现 add_header，
    # nginx 就不再继承 server 级的 add_header，安全响应头会静默失效。
    location ^~ /assets/ {
        alias /agritime/frontend/assets/;
        expires 5m;
    }

    location ^~ /components/ {
        alias /agritime/frontend/components/;
        expires 5m;
    }

    # 页面本身不缓存，改完刷新就能看到
    location ~* \.html$ {
        expires -1;
    }

    # 探活：只放行 /health，供外部监控/负载均衡探测。
    # /api/health/detail 故意不暴露，避免把内部状态（依赖连通性、缓存命中）给到公网。
    location = /health {
        access_log off;
        proxy_pass http://localhost:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3;
        proxy_read_timeout 5;
    }

    location /api/ {
        # 30 次/分钟（V4 T10 要求），burst 放宽到 10：一个页面首次加载会并发
        # 打 4~6 个接口，burst=5 会把正常用户挡在外面
        limit_req zone=agritime_limit burst=10 nodelay;
        # nginx 默认超限返回 503，而验收要求 429 + 友好提示
        limit_req_status 429;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
    }

    location @rate_limit {
        default_type application/json;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后再试","data":null}';
    }

}
