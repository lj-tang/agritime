# 线上 nginx 站点配置（/etc/nginx/sites-enabled/agritime 的副本，纳入版本库便于追溯）
# 修改后同步：cp deploy/nginx/agritime.conf /etc/nginx/sites-enabled/agritime && nginx -t && systemctl reload nginx
# 注意：备份文件不要放在 sites-enabled/ 里，nginx 会把该目录下所有文件都加载，造成 server_name 冲突

server {

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 10m;

    error_page 429 = @rate_limit;

    listen 80;
    server_name _;

    root /agritime/frontend/pages;
    index index.html;
    error_page 404 /404.html;

    location ^~ /assets/ {
        add_header Cache-Control "no-store, no-cache";
        alias /agritime/frontend/assets/;
    }

    location ^~ /components/ {
        add_header Cache-Control "no-store, no-cache";
        alias /agritime/frontend/components/;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache";
    }

    location ~* \.js$ {
        add_header Cache-Control "no-store, no-cache";
    }

    location ~* \.css$ {
        add_header Cache-Control "no-store, no-cache";
    }

    location /api/ {
        limit_req zone=agritime_limit burst=5 nodelay;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90;
    }

    location @rate_limit {
        default_type application/json;
        return 429 '{"code":429,"message":"请求过于频繁，请稍后再试","data":null}';
    }

}
