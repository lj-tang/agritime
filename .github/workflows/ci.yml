name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装浏览器测试依赖
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 全量测试（编译 + 回归 + 前端 + 契约 + 数据资产 + 浏览器冒烟）
        run: bash deploy/tools/test-all.sh
