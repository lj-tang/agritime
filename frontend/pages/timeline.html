<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe3" />
  <title>知农时 · 农事时间线</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/common-logo.svg" />
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/timeline.css" />
  <link rel="stylesheet" href="../components/location-picker/location-picker.css" />
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">
          <img class="brand-logo" src="../assets/img/common-logo.svg" width="24" height="24" alt="" aria-hidden="true" />
        </span>
        <div>
          <div class="brand-name">知农时</div>
          <div class="brand-sub" id="brand-sub">正在读取农时…</div>
        </div>
      </div>
    </header>

    <div class="timeline-map-container" id="timeline-map"></div>

    <p class="crop-resolved-hint" id="crop-resolved-hint" hidden></p>
    <p class="crop-props-hint" id="crop-props-hint" hidden></p>

    <section class="timeline-header" id="conclusion-card" hidden>

      <div class="conclusion" id="conclusion"></div>
      <div class="data-meta" id="data-meta"></div>

      <div class="sowing-actions">
        <button type="button" class="sowing-btn" id="sowing-confirm">确认已播种</button>
        <span class="sowing-hint" id="sowing-hint"></span>
      </div>
    </section>

    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="loading-bar" aria-hidden="true"><i></i></div>
      <p class="loading-text" id="loading-text">正在读取农时…</p>
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
      <div class="skeleton" aria-hidden="true"></div>
    </div>

    <div class="mode-switch" id="mode-switch" hidden>
      <button type="button" class="mode-tab active" data-mode="node">时间节点</button>
      <button type="button" class="mode-tab" data-mode="chart">函数图像</button>
    </div>

    <div class="reminder-panel" id="reminder-panel" hidden>
      <h3>我的农事提醒</h3>
      <div id="reminder-list"></div>
    </div>

    <section class="timeline" id="timeline" hidden></section>

    <section class="chart-wrap" id="chart" hidden></section>

    <section class="empty-state" id="empty-state" hidden>
      <p>未生成节点，请检查作物或日期</p>
      <button type="button" class="btn btn-primary" onclick="window.location.href='index.html'">返回修改</button>
    </section>

    <div class="timeline-footer" id="footer" hidden>
      <button type="button" class="btn btn-ghost" onclick="window.location.href='index.html'">返回修改作物或日期</button>
    </div>
  </main>

  <script src="../assets/mock/mock-data.js"></script>
  <script src="../assets/js/crop-map.js"></script>
  <script src="../assets/js/my-crops-store.js"></script>
  <script src="../shared/utils/timeline-logic.js"></script>
  <script src="../assets/js/chart-client.js"></script>
  <script src="../components/location-picker/location-picker.js"></script>
  <script>
    (function () {
      var STATUS_LABEL = { green: '适宜', yellow: '谨慎', red: '不宜' };
      var DATE_ANCHOR_LABEL = { fixed: '固定公历', lunar: '农历浮动', perYear: '按年指定' };
      var ICONS = {
        term: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M5 8c3 0 5-1.6 7-5 2 3.4 4 5 7 5" stroke="#2f6b40" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      };
      var CONFIG = {
        API_PATH: '/api/timeline',
        TIMELINE_TIMEOUT_MS: 20000,
        DEFAULTS: {
          cropId: 'dry_garlic',
          sowDate: '',
          lat: 35.07,
          lon: 116.31
        }
      };

      function pad2(n) { return String(n).padStart(2, '0'); }
      function dateToStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
      (function () {
        var d = new Date();
        d.setDate(d.getDate() - 150);
        CONFIG.DEFAULTS.sowDate = dateToStr(d);
      })();

      function parseQuery(search) {
        var p = new URLSearchParams(search);
        var cropName = (p.get('crop') || '').trim();
        var sowDate = p.get('sowDate') || CONFIG.DEFAULTS.sowDate;
        var lat = Number(p.get('lat'));
        var lon = Number(p.get('lon'));
        if (!isFinite(lat) || lat < -90 || lat > 90) lat = CONFIG.DEFAULTS.lat;
        if (!isFinite(lon) || lon < -180 || lon > 180) lon = CONFIG.DEFAULTS.lon;
        return {
          crop: window.CropMap.buildCropParam(cropName),
          cropName: cropName,
          sowDate: sowDate,
          lat: lat,
          lon: lon,
          county: p.get('location') || ''
        };
      }

      function buildTimelineUrl(query) {
        var params = new URLSearchParams();
        params.set('crop', query.crop);
        params.set('sowDate', query.sowDate);
        params.set('lat', String(query.lat));
        params.set('lon', String(query.lon));
        return CONFIG.API_PATH + '?' + params.toString();
      }

      var query = parseQuery(window.location.search);
      var degradedSource = '';

      if (window.LocationPicker) {
        window.LocationPicker.initDisplay('timeline-map', query.lat, query.lon);
      }

      function getData() {
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, CONFIG.TIMELINE_TIMEOUT_MS);
        return fetch(buildTimelineUrl(query), { method: 'GET', signal: controller.signal })
          .then(function (res) {
            if (!res.ok) { degradedSource = 'http'; throw new Error('接口返回 ' + res.status); }
            return res.json();
          })
          .then(function (data) {
            clearTimeout(timer);
            if (!data || typeof data !== 'object' || !Array.isArray(data.nodes)) {
              degradedSource = 'invalid';
              return window.MOCK_TIMELINE;
            }
            return data;
          })
          .catch(function (err) {
            clearTimeout(timer);
            if (!degradedSource) {
              degradedSource = (err && err.name === 'AbortError') ? 'timeout' : 'offline';
            }
            return window.MOCK_TIMELINE;
          });
      }

      function badge(status) {
        var span = document.createElement('span');
        span.className = 'badge ' + status;
        span.textContent = STATUS_LABEL[status] || '';
        return span;
      }

      function svgIcon(kind) {
        var span = document.createElement('span');
        span.className = 'icon';
        span.innerHTML = ICONS[kind] || '';
        return span;
      }

      var IMG_ICONS = {
        weather: '../assets/img/timeline-weather-icon.svg',
        festival: '../assets/img/timeline-holiday-icon.svg'
      };

      function nodeIcon(kind) {
        if (kind === 'term') return svgIcon('term');
        var img = document.createElement('img');
        img.className = 'icon';
        img.src = IMG_ICONS[kind] || IMG_ICONS.weather;
        img.alt = kind === 'festival' ? '节日' : '天气';
        return img;
      }

      function noteRow(cls) {
        var div = document.createElement('div');
        div.className = 'tl-note' + (cls ? ' ' + cls : '');
        return div;
      }

      function renderConclusion(data) {
        var card = document.getElementById('conclusion-card');
        var box = document.getElementById('conclusion');
        var meta = document.getElementById('data-meta');
        var tc = data.todayConclusion || {};
        var status = tc.status || 'green';
        box.innerHTML = '';
        box.appendChild(badge(status));
        var text = document.createElement('span');
        text.textContent = tc.copy || '';
        box.appendChild(text);
        card.className = 'timeline-header status-' + status;
        card.hidden = false;

        var hit = window.CropMap.getCropByName(query.cropName);
        var displayCropName = hit ? hit.name : query.cropName;
        document.getElementById('brand-sub').textContent = (displayCropName || '') + ' · ' + (query.sowDate || '');
        var sourceText = { realtime: '实时天气', cache: '缓存天气', unavailable: '天气数据暂不可用' }[data.dataSource] || '';
        var degradedText = { timeout: '接口超时', http: '接口异常', invalid: '数据异常', offline: '网络异常' }[degradedSource] || '';
        var extra = degradedSource ? ' · 本地兜底数据（' + degradedText + '）' : '';
        meta.textContent = '数据来源：' + sourceText + (data.dataTime ? ' · 数据时间 ' + new Date(data.dataTime).toLocaleString() : '') + extra;
        meta.className = 'data-meta' + ((data.dataSource === 'realtime' && !degradedSource) ? '' : ' warn');

        bindSowingConfirm(displayCropName);
      }

      /**
       * 确认播种 → 写入「我的作物」（T12 日历联动）
       *
       * 日历通常嵌在主页的 iframe 里，CustomEvent 跨不过 iframe 边界，
       * 所以嵌在主页时用 postMessage 交给父页面处理；单独打开时直接写本地存储，
       * 两条路径只走其中一条，避免同一条记录被加两次。
       */
      function bindSowingConfirm(displayCropName) {
        var btn = document.getElementById('sowing-confirm');
        var hint = document.getElementById('sowing-hint');
        if (!btn) return;

        btn.disabled = false;
        btn.textContent = '确认已播种';
        if (hint) hint.textContent = '';

        btn.onclick = function () {
          var detail = {
            cropName: displayCropName,
            cropId: query.crop || null,
            sownDate: query.sowDate || null,
            lat: query.lat,
            lon: query.lon
          };

          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'agritime:sowing-confirmed', detail: detail }, '*');
          } else if (window.MyCropsStore) {
            window.MyCropsStore.add({
              cropName: detail.cropName,
              cropId: detail.cropId,
              sownDate: detail.sownDate
            });
          }

          btn.disabled = true;
          btn.textContent = '已加入我的作物';
          if (hint) hint.textContent = '到「我的作物」可补充发芽情况和长势';
        };
      }

      function renderWeather(card, node) {
        var logic = window.TimelineLogic;
        var factors = logic.normalizeFactors(node.weatherFactors);
        var hasWeather = node.weatherIcon != null || node.suitability != null ||
          node.severeWeatherAlert != null || factors.length > 0;

        if (!hasWeather) {
          var neutral = noteRow('tl-weather-neutral');
          neutral.appendChild(nodeIcon('weather'));
          var nt = document.createElement('span');
          nt.textContent = '天气数据暂不可用';
          neutral.appendChild(nt);
          card.appendChild(neutral);
          return;
        }

        var alert = logic.getSevereAlert(node.severeWeatherAlert);
        if (alert) {
          var aNote = noteRow('tl-alert');
          var at = document.createElement('span');
          at.textContent = '⚠ 天气警示 · ' + alert.label + (alert.tip ? '：' + alert.tip : '');
          aNote.appendChild(at);
          card.appendChild(aNote);
          if (node.suitability === 'green') {
            var aTip = noteRow('tl-alert-tip');
            aTip.textContent = '虽有适宜条件但存在极端天气，建议调整';
            card.appendChild(aTip);
          }
        }

        var wi = logic.getWeatherIcon(node.weatherIcon);
        if (wi) {
          var wNote = noteRow('tl-weather');
          wNote.appendChild(nodeIcon('weather'));
          var wt = document.createElement('span');
          wt.textContent = '天气 · ' + wi.label;
          wNote.appendChild(wt);
          card.appendChild(wNote);
        }

        var suit = logic.getSuitability(node.suitability);
        if (suit) {
          var sNote = noteRow('tl-suitability ' + suit.class);
          var st = document.createElement('span');
          st.textContent = '适宜度 · ' + suit.label;
          sNote.appendChild(st);
          card.appendChild(sNote);
        }

        if (factors.length) {
          var fNote = noteRow('tl-factors');
          var ft = document.createElement('span');
          ft.textContent = '天气因子 · ' + factors.join('；');
          fNote.appendChild(ft);
          card.appendChild(fNote);
        }
      }

      function renderNode(node) {
        var wrap = document.createElement('div');
        wrap.className = 'tl-node ' + (node.certainty === 'predicted' ? 'predicted' : 'certain') + ' status-' + (node.status || 'green');

        var dot = document.createElement('span');
        dot.className = 'tl-dot';
        wrap.appendChild(dot);

        var card = document.createElement('div');
        card.className = 'tl-card';
        card.addEventListener('click', function () { card.classList.toggle('open'); });

        var action = document.createElement('div');
        action.className = 'tl-action';
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = node.name || '';
        var date = document.createElement('span');
        date.className = 'date';
        date.textContent = node.date || '';
        action.appendChild(name);
        action.appendChild(date);
        card.appendChild(action);

        var decision = document.createElement('div');
        decision.className = 'tl-decision';
        decision.textContent = node.copy || '';
        card.appendChild(decision);

        if (node.rescheduleAdvice) {
          var advice = document.createElement('div');
          advice.className = 'tl-advice';
          advice.textContent = '↳ ' + node.rescheduleAdvice;
          card.appendChild(advice);
        }

        if (node.solarTerm) {
          var termNote = noteRow('tl-term');
          termNote.appendChild(svgIcon('term'));
          var tt = document.createElement('span');
          tt.textContent = '节气 · ' + node.solarTerm + (node.solarTermTip ? '：' + node.solarTermTip : '');
          termNote.appendChild(tt);
          card.appendChild(termNote);
        }

        renderWeather(card, node);

        // T04：未来第 5 天起标注天气为预报值
        if (node.forecastNote) {
          var fn = document.createElement('span');
          fn.className = 'tl-forecast-note';
          fn.textContent = '天气为预测数据，仅供参考';
          card.appendChild(fn);
        }
        // 超出预报范围时用去年同日补位，必须让用户知道这不是预报
        if (node.climateNormal) {
          var cn = document.createElement('span');
          cn.className = 'tl-forecast-note tl-climate-note';
          cn.textContent = '常年同期参考，非预报';
          card.appendChild(cn);
        }

        // T04：关键节点可开启提醒，前端展示倒计时
        if (node.date && node.date >= todayStr()) {
          var rb = document.createElement('button');
          rb.type = 'button';
          rb.className = 'tl-remind';
          var key = reminderKey(node);
          var on = isReminded(node);
          rb.textContent = on ? '🔔 已设提醒' : '🔔 设提醒';
          if (on) rb.classList.add('on');
          rb.addEventListener('click', function (ev) {
            ev.stopPropagation();
            toggleReminder(node);
            var now = isReminded(node);
            rb.textContent = now ? '🔔 已设提醒' : '🔔 设提醒';
            rb.classList.toggle('on', now);
            renderMyReminders();
          });
          card.appendChild(rb);
        }

        var detail = document.createElement('div');
        detail.className = 'tl-detail';
        var desc = document.createElement('p');
        desc.textContent = node.description || '';
        detail.appendChild(desc);
        if (node.reasons && node.reasons.length) {
          var ul = document.createElement('ul');
          node.reasons.forEach(function (r) { var li = document.createElement('li'); li.textContent = r; ul.appendChild(li); });
          detail.appendChild(ul);
        }
        renderGuidance(detail, node.guidance);
        card.appendChild(detail);

        wrap.appendChild(card);
        return wrap;
      }

      // T03：四类农事指导（浇水/施肥/病虫害/农具）+ 天气调整依据
      function renderGuidance(host, g) {
        if (!g) return;
        var box = document.createElement('div');
        box.className = 'tl-guide';

        function section(titleText) {
          var h = document.createElement('div');
          h.className = 'tl-guide-title';
          h.textContent = titleText;
          box.appendChild(h);
        }
        function line(label, value) {
          if (!value) return;
          var p = document.createElement('p');
          p.className = 'tl-guide-line';
          var b = document.createElement('b');
          b.textContent = label;
          p.appendChild(b);
          p.appendChild(document.createTextNode(' ' + value));
          box.appendChild(p);
        }

        if (g.watering) {
          section('浇水');
          line(g.watering.method || '方式', [g.watering.duration, g.watering.waterPerMu].filter(Boolean).join(' · '));
          if (g.watering.tips) line('要点', g.watering.tips);
          if (g.watering.basis) {
            var basis = document.createElement('p');
            basis.className = 'tl-guide-basis';
            basis.textContent = '依据：' + g.watering.basis;
            box.appendChild(basis);
          }
        }

        if (g.fertilize && g.fertilize.type) {
          section('施肥');
          line(g.fertilize.type, 'N-P-K ' + (g.fertilize.npk || '—') + ' · ' + (g.fertilize.amount || ''));
          if (g.fertilize.method) line('方法', g.fertilize.method);
          if (g.fertilize.tips) line('要点', g.fertilize.tips);
        }

        if (g.pest && g.pest.length) {
          section('病虫害');
          g.pest.forEach(function (p) {
            var item = document.createElement('div');
            item.className = 'tl-guide-pest';
            var n = document.createElement('b'); n.textContent = p.name || '';
            item.appendChild(n);
            if (p.symptom) item.appendChild(document.createTextNode('：' + p.symptom));
            if (p.solution) {
              var s = document.createElement('span');
              s.className = 'tl-guide-med';
              s.textContent = '用药：' + p.solution + (p.dosage ? '（' + p.dosage + '）' : '');
              item.appendChild(s);
            }
            box.appendChild(item);
          });
          if (g.pestSource) {
            var src = document.createElement('p');
            src.className = 'tl-guide-basis';
            src.textContent = '来源：' + g.pestSource;
            box.appendChild(src);
          }
        }

        if (g.tools && g.tools.length) {
          section('农具');
          var chips = document.createElement('div');
          chips.className = 'tl-guide-tools';
          g.tools.forEach(function (t) {
            var c = document.createElement('span');
            c.textContent = t;
            chips.appendChild(c);
          });
          box.appendChild(chips);
        }

        if (g.notes && g.notes.length) {
          section('提示');
          var ul = document.createElement('ul');
          g.notes.forEach(function (n) { var li = document.createElement('li'); li.textContent = n; ul.appendChild(li); });
          box.appendChild(ul);
        }

        host.appendChild(box);
      }

      // ---------------- T04 节点提醒（localStorage，刷新不丢） ----------------
      var REMIND_KEY = 'agritime.reminders.v1';

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }
      function loadReminders() {
        try { return JSON.parse(localStorage.getItem(REMIND_KEY) || '[]'); } catch (e) { return []; }
      }
      function saveReminders(list) {
        try { localStorage.setItem(REMIND_KEY, JSON.stringify(list)); } catch (e) { /* 隐私模式忽略 */ }
      }
      function reminderKey(node) {
        var crop = window.__cropStandardName || query.cropName || '';
        return crop + '|' + (node.date || '') + '|' + (node.name || '');
      }
      function isReminded(node) {
        var k = reminderKey(node);
        return loadReminders().some(function (r) { return r.key === k; });
      }
      function toggleReminder(node) {
        var list = loadReminders();
        var k = reminderKey(node);
        var idx = list.findIndex(function (r) { return r.key === k; });
        if (idx >= 0) list.splice(idx, 1);
        else list.push({ key: k, date: node.date, name: node.name || '', crop: query.cropName || '' });
        saveReminders(list);
      }
      function pruneReminders(list) {
        // 节点日期过去 7 天后自动清理，否则提醒面板会越攒越多"已过"
        var cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 7);
        var cut = cutoff.getFullYear() + '-' + String(cutoff.getMonth() + 1).padStart(2, '0') + '-' + String(cutoff.getDate()).padStart(2, '0');
        var kept = list.filter(function (r) { return r.date && r.date >= cut; });
        if (kept.length !== list.length) saveReminders(kept);
        return kept;
      }

      function renderMyReminders() {
        var panel = document.getElementById('reminder-panel');
        var box = document.getElementById('reminder-list');
        if (!panel || !box) return;
        var list = pruneReminders(loadReminders()).filter(function (r) { return r.date; })
          .sort(function (a, b) { return a.date < b.date ? -1 : 1; });
        box.innerHTML = '';
        if (!list.length) { panel.hidden = true; return; }
        panel.hidden = false;
        list.forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'reminder-row';
          var cd = window.TimelineLogic && window.TimelineLogic.calcCountdown
            ? window.TimelineLogic.calcCountdown(r.date) : { state: 'future', days: 0 };
          var day = document.createElement('span');
          day.className = 'cd-day';
          day.textContent = cd.state === 'today' ? '今天' : (cd.state === 'past' ? '已过' : '还有 ' + cd.days + ' 天');
          var label = document.createElement('span');
          label.textContent = r.date + ' · ' + (r.crop ? r.crop + ' ' : '') + r.name;
          var del = document.createElement('button');
          del.className = 'del';
          del.type = 'button';
          del.textContent = '×';
          del.setAttribute('aria-label', '删除提醒');
          del.addEventListener('click', function () {
            var all = loadReminders().filter(function (x) { return x.key !== r.key; });
            saveReminders(all);
            renderMyReminders();
            if (cachedData && cachedData.nodes) {
              var tl = document.getElementById('timeline');
              tl.innerHTML = '';
              cachedData.nodes.forEach(function (n) { tl.appendChild(renderNode(n)); });
            }
          });
          row.appendChild(day);
          row.appendChild(label);
          row.appendChild(del);
          box.appendChild(row);
        });
      }

      function renderReminder(r) {
        var wrap = document.createElement('div');
        wrap.className = 'tl-node certain';
        var dot = document.createElement('span');
        dot.className = 'tl-dot';
        wrap.appendChild(dot);
        var card = document.createElement('div');
        card.className = 'tl-card tl-festival';
        var action = document.createElement('div');
        action.className = 'tl-action';
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = r.festivalName ? r.festivalName + ' · 销售窗口' : '销售窗口';
        var date = document.createElement('span');
        date.className = 'date';
        date.textContent = r.festivalDate || '';
        action.appendChild(name); action.appendChild(date);
        card.appendChild(action);

        var cd = window.TimelineLogic.calcCountdown(r.festivalDate);
        var cdText = '';
        if (cd.state === 'future') cdText = '距 ' + (r.festivalName || '该节点') + ' 还有 ' + cd.days + ' 天';
        else if (cd.state === 'today') cdText = (r.festivalName || '该节点') + ' 就是今天';
        else if (cd.state === 'past') cdText = (r.festivalName || '该节点') + ' 已过';
        if (cdText) {
          var cdNote = noteRow('tl-countdown');
          cdNote.textContent = cdText;
          card.appendChild(cdNote);
        }

        if (r.dateAnchor) {
          var anchorNote = noteRow('tl-anchor');
          anchorNote.textContent = '日期锚点 · ' + (DATE_ANCHOR_LABEL[r.dateAnchor] || r.dateAnchor);
          card.appendChild(anchorNote);
        }

        var copy = r.salesCopy || r.reminderCopy;
        if (copy) {
          var note = noteRow('tl-festival-copy');
          note.appendChild(nodeIcon('festival'));
          var t = document.createElement('span');
          t.textContent = copy;
          note.appendChild(t);
          card.appendChild(note);
        }

        if (r.applicableCrops) {
          var cropsNote = noteRow('tl-crops');
          cropsNote.textContent = '适用作物 · ' + r.applicableCrops;
          card.appendChild(cropsNote);
        }

        wrap.appendChild(card);
        return wrap;
      }

      var CHART_CONFIG = {
        VIEWBOX_W: 360, VIEWBOX_H: 200,
        PADDING_LEFT: 40, PADDING_BOTTOM: 30, PADDING_TOP: 10, PADDING_RIGHT: 10,
        SIGMA: 15, SAMPLE_STEP: 2, PEAK_LEVEL: 1,
        PLACEHOLDER_TEXT: '数据待接入'
      };
      var SVG_NS = 'http://www.w3.org/2000/svg';
      var currentMode = 'node';
      var chartRendered = false;
      var cachedData = null;

      function gaussianPath(cx, sigma, xStart, xEnd, yBase, yPeak) {
        var d = '';
        for (var px = xStart; px <= xEnd; px += CHART_CONFIG.SAMPLE_STEP) {
          var gauss = Math.exp(-Math.pow(px - cx, 2) / (2 * sigma * sigma));
          var py = yBase - gauss * (yBase - yPeak);
          d += (d ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1) + ' ';
        }
        return d;
      }

      function buildEmptyChartSVG() {
        var ns = SVG_NS;
        var svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + CHART_CONFIG.VIEWBOX_W + ' ' + CHART_CONFIG.VIEWBOX_H);
        svg.setAttribute('class', 'chart-svg');
        var yBase = CHART_CONFIG.VIEWBOX_H - CHART_CONFIG.PADDING_BOTTOM;
        var yPeak = CHART_CONFIG.PADDING_TOP;
        var xStart = CHART_CONFIG.PADDING_LEFT;
        var xEnd = CHART_CONFIG.VIEWBOX_W - CHART_CONFIG.PADDING_RIGHT;
        var axisY = document.createElementNS(ns, 'line');
        axisY.setAttribute('x1', xStart); axisY.setAttribute('y1', yPeak);
        axisY.setAttribute('x2', xStart); axisY.setAttribute('y2', yBase);
        axisY.setAttribute('class', 'chart-axis');
        svg.appendChild(axisY);
        var axisX = document.createElementNS(ns, 'line');
        axisX.setAttribute('x1', xStart); axisX.setAttribute('y1', yBase);
        axisX.setAttribute('x2', xEnd); axisX.setAttribute('y2', yBase);
        axisX.setAttribute('class', 'chart-axis');
        svg.appendChild(axisX);
        var labelHigh = document.createElementNS(ns, 'text');
        labelHigh.setAttribute('x', xStart - 6); labelHigh.setAttribute('y', yPeak + 8);
        labelHigh.setAttribute('text-anchor', 'end'); labelHigh.setAttribute('class', 'chart-placeholder');
        labelHigh.textContent = '高';
        svg.appendChild(labelHigh);
        var labelLow = document.createElementNS(ns, 'text');
        labelLow.setAttribute('x', xStart - 6); labelLow.setAttribute('y', yBase + 4);
        labelLow.setAttribute('text-anchor', 'end'); labelLow.setAttribute('class', 'chart-placeholder');
        labelLow.textContent = '低';
        svg.appendChild(labelLow);
        var placeholder = document.createElementNS(ns, 'text');
        placeholder.setAttribute('x', CHART_CONFIG.VIEWBOX_W / 2);
        placeholder.setAttribute('y', CHART_CONFIG.VIEWBOX_H / 2);
        placeholder.setAttribute('text-anchor', 'middle'); placeholder.setAttribute('class', 'chart-placeholder');
        placeholder.textContent = CHART_CONFIG.PLACEHOLDER_TEXT;
        svg.appendChild(placeholder);
        return svg;
      }

      function buildChartSVG(nodes) {
        var ns = SVG_NS;
        var svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + CHART_CONFIG.VIEWBOX_W + ' ' + CHART_CONFIG.VIEWBOX_H);
        svg.setAttribute('class', 'chart-svg');
        var yBase = CHART_CONFIG.VIEWBOX_H - CHART_CONFIG.PADDING_BOTTOM;
        var yPeak = CHART_CONFIG.PADDING_TOP;
        var xStart = CHART_CONFIG.PADDING_LEFT;
        var xEnd = CHART_CONFIG.VIEWBOX_W - CHART_CONFIG.PADDING_RIGHT;
        var plotW = xEnd - xStart;
        var days = nodes.map(function (n) { return n.daysAfterSowing; }).filter(function (d) { return d != null; });
        if (days.length === 0) return buildEmptyChartSVG();
        var minDay = Math.min.apply(null, days);
        var maxDay = Math.max.apply(null, days);
        if (maxDay === minDay) maxDay = minDay + 1;
        var axisY = document.createElementNS(ns, 'line');
        axisY.setAttribute('x1', xStart); axisY.setAttribute('y1', yPeak);
        axisY.setAttribute('x2', xStart); axisY.setAttribute('y2', yBase);
        axisY.setAttribute('class', 'chart-axis');
        svg.appendChild(axisY);
        var axisX = document.createElementNS(ns, 'line');
        axisX.setAttribute('x1', xStart); axisX.setAttribute('y1', yBase);
        axisX.setAttribute('x2', xEnd); axisX.setAttribute('y2', yBase);
        axisX.setAttribute('class', 'chart-axis');
        svg.appendChild(axisX);
        var sigma = CHART_CONFIG.SIGMA;
        var d = '';
        nodes.forEach(function (n) {
          if (n.daysAfterSowing == null) return;
          var cx = xStart + (n.daysAfterSowing - minDay) / (maxDay - minDay) * plotW;
          d += gaussianPath(cx, sigma, xStart, xEnd, yBase, yPeak);
        });
        if (d) {
          var path = document.createElementNS(ns, 'path');
          path.setAttribute('d', d);
          path.setAttribute('class', 'chart-curve');
          svg.appendChild(path);
        }
        var labelHigh = document.createElementNS(ns, 'text');
        labelHigh.setAttribute('x', xStart - 6); labelHigh.setAttribute('y', yPeak + 8);
        labelHigh.setAttribute('text-anchor', 'end'); labelHigh.setAttribute('class', 'chart-placeholder');
        labelHigh.textContent = '高';
        svg.appendChild(labelHigh);
        var labelLow = document.createElementNS(ns, 'text');
        labelLow.setAttribute('x', xStart - 6); labelLow.setAttribute('y', yBase + 4);
        labelLow.setAttribute('text-anchor', 'end'); labelLow.setAttribute('class', 'chart-placeholder');
        labelLow.textContent = '低';
        svg.appendChild(labelLow);
        return svg;
      }

      function renderChart(data) {
        var chart = document.getElementById('chart');
        chart.innerHTML = '';
        var nodes = (data && Array.isArray(data.nodes)) ? data.nodes : [];
        var hasRealData = nodes.some(function (n) { return n.date != null || n.name != null; });
        var hasValidDays = nodes.some(function (n) { return n.daysAfterSowing != null; });
        var svg = (hasRealData && hasValidDays) ? buildChartSVG(nodes) : buildEmptyChartSVG();
        chart.appendChild(svg);
        chartRendered = true;
      }

      function requestChart() {
        var chart = document.getElementById('chart');
        if (!window.ChartClient) { renderChart(cachedData); return; }
        chart.innerHTML = '';
        var loading = document.createElement('p');
        loading.className = 'chart-loading';
        loading.textContent = '正在生成图像…';
        chart.appendChild(loading);
        window.ChartClient.request({
          crop: query.crop,
          sowDate: query.sowDate,
          lat: query.lat,
          lon: query.lon,
          nodes: (cachedData && cachedData.nodes) || []
        }).then(function (res) {
          if (res && res.ok && res.data) renderChart(res.data);
          else renderChart(cachedData);
        });
      }

      function renderModeSwitch() {
        var sw = document.getElementById('mode-switch');
        sw.hidden = false;
        sw.querySelectorAll('.mode-tab').forEach(function (tab) {
          tab.addEventListener('click', function () { switchMode(this.getAttribute('data-mode')); });
        });
      }

      function switchMode(mode) {
        if (mode !== 'node' && mode !== 'chart') return;
        currentMode = mode;
        var sw = document.getElementById('mode-switch');
        sw.querySelectorAll('.mode-tab').forEach(function (tab) {
          if (tab.getAttribute('data-mode') === mode) tab.classList.add('active');
          else tab.classList.remove('active');
        });
        document.getElementById('timeline').hidden = (mode !== 'node');
        document.getElementById('chart').hidden = (mode !== 'chart');
        if (mode === 'chart' && !chartRendered) requestChart();
      }

      function render(data) {
        document.getElementById('loading').hidden = true;
        if (!data || typeof data !== 'object') data = { todayConclusion: {}, nodes: [] };
        if (!Array.isArray(data.nodes)) data = { todayConclusion: data.todayConclusion || {}, nodes: [] };
        // 提醒键要用标准作物名：否则同一作物用俗称（西红柿）和标准名（番茄）
        // 各存一条，用户会看到重复提醒
        if (data.cropName) window.__cropStandardName = data.cropName;
        // T02：后端会把俗称归一到标准名，这里如实告诉用户映射结果
        if (data.cropName && data.requestedCrop && data.cropName !== data.requestedCrop) {
          var hint = document.getElementById('crop-resolved-hint');
          if (hint) {
            hint.hidden = false;
            hint.textContent = '「' + data.requestedCrop + '」已识别为作物：' + data.cropName;
          }
        }
        // T07：作物属性（熟制/年限）——解释"为什么这个作物会有两季/跨年节点"
        if (data.cropProperties) {
          var cp = data.cropProperties;
          var propsEl = document.getElementById('crop-props-hint');
          if (propsEl) {
            propsEl.hidden = false;
            var parts = [];
            if (cp.lifespanLabel) parts.push(cp.lifespanLabel);
            else if (cp.lifespan === 'perennial') parts.push('多年生');
            if (cp.croppingSystem === 'single') parts.push('一年一熟');
            else if (cp.croppingSystem === 'double') parts.push('一年多熟');
            else if (cp.croppingSystem === 'multi') parts.push('一年多茬');
            if (cp.totalDays) parts.push('全生育期约 ' + cp.totalDays + ' 天');
            if (cp.suitableSeason) parts.push(cp.suitableSeason);
            propsEl.textContent = '作物属性：' + parts.join(' · ')
              + (cp.source === 'category-rule' ? '（属性按类别推定）' : '');
          }
        }
        if (data.nodes.length === 0) {
          document.getElementById('empty-state').hidden = false;
          return;
        }
        renderConclusion(data);
        cachedData = data;
        renderModeSwitch();
        var timeline = document.getElementById('timeline');
        timeline.innerHTML = '';
        data.nodes.forEach(function (n) { timeline.appendChild(renderNode(n)); });
        var reminders = Array.isArray(data.reminders) ? data.reminders : [];
        reminders.forEach(function (r) {
          if (r && (r.festivalName || r.festivalDate || r.reminderCopy || r.salesCopy)) {
            timeline.appendChild(renderReminder(r));
          }
        });
        timeline.hidden = false;
        document.getElementById('footer').hidden = false;
      }

      getData().then(function (data) {
        render(data);
        renderMyReminders();
      });
    })();
  </script>
