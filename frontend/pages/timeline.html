<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe3" />
  <title>知农时 · 农事时间线</title>
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/timeline.css" />
</head>
<body>
  <main class="page">
    <header class="brand">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">
          <img class="brand-logo" src="../assets/img/common-logo.svg" width="24" height="24" alt="" aria-hidden="true" />
        </span>
        <div>
          <div class="brand-name">知农时</div>
          <div class="brand-sub" id="brand-sub">正在读取农时…</div>
        </div>
      </div>
    </header>

    <section class="timeline-header" id="conclusion-card" hidden>

      <div class="conclusion" id="conclusion"></div>
      <div class="data-meta" id="data-meta"></div>
    </section>

    <div class="loading" id="loading">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <div class="mode-switch" id="mode-switch" hidden>
      <button type="button" class="mode-tab active" data-mode="node">时间节点</button>
      <button type="button" class="mode-tab" data-mode="chart">函数图像</button>
    </div>

    <section class="timeline" id="timeline" hidden></section>

    <section class="chart-wrap" id="chart" hidden></section>

    <section class="empty-state" id="empty-state" hidden>
      <p>未生成节点，请检查作物或日期</p>
      <button type="button" class="btn btn-primary" onclick="window.location.href='index.html'">返回修改</button>
    </section>

    <div class="timeline-footer" id="footer" hidden>
      <button type="button" class="btn btn-ghost" onclick="window.location.href='index.html'">返回修改作物或日期</button>
    </div>
  </main>

  <script src="../assets/mock/mock-data.js"></script>
  <script src="../assets/js/crop-map.js"></script>
  <script>
    (function () {
      var STATUS_LABEL = { green: '适宜', yellow: '谨慎', red: '不宜' };
      var WEATHER_WORD = {
        clear: '晴', cloudy: '多云', overcast: '阴', lightRain: '小雨',
        heavyRain: '大雨', storm: '暴雨', windy: '大风', hot: '高温', cold: '低温'
      };
      var ICONS = {
        term: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M5 8c3 0 5-1.6 7-5 2 3.4 4 5 7 5" stroke="#2f6b40" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      };
      var CONFIG = {
        API_PATH: '/api/timeline',
        TIMELINE_TIMEOUT_MS: 20000,
        DEFAULTS: {
          cropId: 'dry_garlic',
          sowDate: '',
          lat: 35.07,
          lon: 116.31
        }
      };

      function pad2(n) { return String(n).padStart(2, '0'); }
      function dateToStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
      (function () {
        var d = new Date();
        d.setDate(d.getDate() - 150);
        CONFIG.DEFAULTS.sowDate = dateToStr(d);
      })();

      function parseQuery(search) {
        var p = new URLSearchParams(search);
        var cropName = (p.get('crop') || '').trim();
        var sowDate = p.get('sowDate') || CONFIG.DEFAULTS.sowDate;
        var lat = Number(p.get('lat'));
        var lon = Number(p.get('lon'));
        if (!isFinite(lat) || lat < -90 || lat > 90) lat = CONFIG.DEFAULTS.lat;
        if (!isFinite(lon) || lon < -180 || lon > 180) lon = CONFIG.DEFAULTS.lon;
        return {
          crop: window.CropMap.buildCropParam(cropName),
          cropName: cropName,
          sowDate: sowDate,
          lat: lat,
          lon: lon,
          county: p.get('location') || ''
        };
      }

      function buildTimelineUrl(query) {
        var params = new URLSearchParams();
        params.set('crop', query.crop);
        params.set('sowDate', query.sowDate);
        params.set('lat', String(query.lat));
        params.set('lon', String(query.lon));
        return CONFIG.API_PATH + '?' + params.toString();
      }

      var query = parseQuery(window.location.search);
      var degradedSource = '';

      function getData() {
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, CONFIG.TIMELINE_TIMEOUT_MS);
        return fetch(buildTimelineUrl(query), { method: 'GET', signal: controller.signal })
          .then(function (res) {
            if (!res.ok) { degradedSource = 'http'; throw new Error('接口返回 ' + res.status); }
            return res.json();
          })
          .then(function (data) {
            clearTimeout(timer);
            if (!data || typeof data !== 'object' || !Array.isArray(data.nodes)) {
              degradedSource = 'invalid';
              return window.MOCK_TIMELINE;
            }
            return data;
          })
          .catch(function (err) {
            clearTimeout(timer);
            if (!degradedSource) {
              degradedSource = (err && err.name === 'AbortError') ? 'timeout' : 'offline';
            }
            return window.MOCK_TIMELINE;
          });
      }

      function badge(status) {
        var span = document.createElement('span');
        span.className = 'badge ' + status;
        span.textContent = STATUS_LABEL[status] || '';
        return span;
      }

      function svgIcon(kind) {
        var span = document.createElement('span');
        span.className = 'icon';
        span.innerHTML = ICONS[kind] || '';
        return span;
      }

      var IMG_ICONS = {
        weather: '../assets/img/timeline-weather-icon.svg',
        festival: '../assets/img/timeline-holiday-icon.svg'
      };

      function nodeIcon(kind) {
        if (kind === 'term') return svgIcon('term');
        var img = document.createElement('img');
        img.className = 'icon';
        img.src = IMG_ICONS[kind] || IMG_ICONS.weather;
        img.alt = kind === 'festival' ? '节日' : '天气';
        return img;
      }

      function renderConclusion(data) {
        var card = document.getElementById('conclusion-card');
        var box = document.getElementById('conclusion');
        var meta = document.getElementById('data-meta');
        var tc = data.todayConclusion || {};
        var status = tc.status || 'green';
        box.innerHTML = '';
        box.appendChild(badge(status));
        var text = document.createElement('span');
        text.textContent = tc.copy || '';
        box.appendChild(text);
        card.className = 'timeline-header status-' + status;
        card.hidden = false;

        var hit = window.CropMap.getCropByName(query.cropName);
        var displayCropName = hit ? hit.name : query.cropName;
        document.getElementById('brand-sub').textContent = (displayCropName || '') + ' · ' + (query.sowDate || '');
        var sourceText = { realtime: '实时天气', cache: '缓存天气', unavailable: '天气数据暂不可用' }[data.dataSource] || '';
        var degradedText = { timeout: '接口超时', http: '接口异常', invalid: '数据异常', offline: '网络异常' }[degradedSource] || '';
        var extra = degradedSource ? ' · 本地兜底数据（' + degradedText + '）' : '';
        meta.textContent = '数据来源：' + sourceText + (data.dataTime ? ' · 数据时间 ' + new Date(data.dataTime).toLocaleString() : '') + extra;
        meta.className = 'data-meta' + ((data.dataSource === 'realtime' && !degradedSource) ? '' : ' warn');
      }

      function renderNode(node) {
        var wrap = document.createElement('div');
        wrap.className = 'tl-node ' + (node.certainty === 'predicted' ? 'predicted' : 'certain') + ' status-' + (node.status || 'green');

        var dot = document.createElement('span');
        dot.className = 'tl-dot';
        wrap.appendChild(dot);

        var card = document.createElement('div');
        card.className = 'tl-card';
        card.addEventListener('click', function () { card.classList.toggle('open'); });

        var action = document.createElement('div');
        action.className = 'tl-action';
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = node.name || '';
        var date = document.createElement('span');
        date.className = 'date';
        date.textContent = node.date || '';
        action.appendChild(name);
        action.appendChild(date);
        card.appendChild(action);

        var decision = document.createElement('div');
        decision.className = 'tl-decision';
        decision.textContent = node.copy || '';
        card.appendChild(decision);

        if (node.rescheduleAdvice) {
          var advice = document.createElement('div');
          advice.className = 'tl-advice';
          advice.textContent = '↳ ' + node.rescheduleAdvice;
          card.appendChild(advice);
        }

        if (node.solarTerm) {
          var termNote = document.createElement('div');
          termNote.className = 'tl-note';
          termNote.appendChild(svgIcon('term'));
          var tt = document.createElement('span');
          tt.textContent = '节气 · ' + node.solarTerm + (node.solarTermTip ? '：' + node.solarTermTip : '');
          termNote.appendChild(tt);
          card.appendChild(termNote);
        } else if (node.weatherIcon) {
          var wNote = document.createElement('div');
          wNote.className = 'tl-note';
          wNote.appendChild(nodeIcon('weather'));
          var wt = document.createElement('span');
          wt.textContent = '天气 · ' + (WEATHER_WORD[node.weatherIcon] || node.weatherIcon);
          wNote.appendChild(wt);
          card.appendChild(wNote);
        }

        var detail = document.createElement('div');
        detail.className = 'tl-detail';
        var desc = document.createElement('p');
        desc.textContent = node.description || '';
        detail.appendChild(desc);
        if (node.reasons && node.reasons.length) {
          var ul = document.createElement('ul');
          node.reasons.forEach(function (r) { var li = document.createElement('li'); li.textContent = r; ul.appendChild(li); });
          detail.appendChild(ul);
        }
        card.appendChild(detail);

        wrap.appendChild(card);
        return wrap;
      }

      function renderReminder(r) {
        var wrap = document.createElement('div');
        wrap.className = 'tl-node certain';
        var dot = document.createElement('span');
        dot.className = 'tl-dot';
        wrap.appendChild(dot);
        var card = document.createElement('div');
        card.className = 'tl-card';
        var action = document.createElement('div');
        action.className = 'tl-action';
        var name = document.createElement('span');
        name.className = 'name';
        name.textContent = r.festivalName ? r.festivalName + ' · 销售窗口' : '销售窗口';
        var date = document.createElement('span');
        date.className = 'date';
        date.textContent = r.festivalDate || '';
        action.appendChild(name); action.appendChild(date);
        card.appendChild(action);
        var note = document.createElement('div');
        note.className = 'tl-note';
        note.appendChild(nodeIcon('festival'));
        var t = document.createElement('span');
        t.textContent = r.reminderCopy;
        note.appendChild(t);
        card.appendChild(note);
        wrap.appendChild(card);
        return wrap;
      }

      var CHART_CONFIG = {
        VIEWBOX_W: 360, VIEWBOX_H: 200,
        PADDING_LEFT: 40, PADDING_BOTTOM: 30, PADDING_TOP: 10, PADDING_RIGHT: 10,
        SIGMA: 15, SAMPLE_STEP: 2, PEAK_LEVEL: 1,
        PLACEHOLDER_TEXT: '数据待接入'
      };
      var SVG_NS = 'http://www.w3.org/2000/svg';
      var currentMode = 'node';
      var chartRendered = false;
      var cachedData = null;

      function gaussianPath(cx, sigma, xStart, xEnd, yBase, yPeak) {
        var d = '';
        for (var px = xStart; px <= xEnd; px += CHART_CONFIG.SAMPLE_STEP) {
          var gauss = Math.exp(-Math.pow(px - cx, 2) / (2 * sigma * sigma));
          var py = yBase - gauss * (yBase - yPeak);
          d += (d ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1) + ' ';
        }
        return d;
      }

      function buildEmptyChartSVG() {
        var ns = SVG_NS;
        var svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + CHART_CONFIG.VIEWBOX_W + ' ' + CHART_CONFIG.VIEWBOX_H);
        svg.setAttribute('class', 'chart-svg');
        var yBase = CHART_CONFIG.VIEWBOX_H - CHART_CONFIG.PADDING_BOTTOM;
        var yPeak = CHART_CONFIG.PADDING_TOP;
        var xStart = CHART_CONFIG.PADDING_LEFT;
        var xEnd = CHART_CONFIG.VIEWBOX_W - CHART_CONFIG.PADDING_RIGHT;
        var axisY = document.createElementNS(ns, 'line');
        axisY.setAttribute('x1', xStart); axisY.setAttribute('y1', yPeak);
        axisY.setAttribute('x2', xStart); axisY.setAttribute('y2', yBase);
        axisY.setAttribute('class', 'chart-axis');
        svg.appendChild(axisY);
        var axisX = document.createElementNS(ns, 'line');
        axisX.setAttribute('x1', xStart); axisX.setAttribute('y1', yBase);
        axisX.setAttribute('x2', xEnd); axisX.setAttribute('y2', yBase);
        axisX.setAttribute('class', 'chart-axis');
        svg.appendChild(axisX);
        var labelHigh = document.createElementNS(ns, 'text');
        labelHigh.setAttribute('x', xStart - 6); labelHigh.setAttribute('y', yPeak + 8);
        labelHigh.setAttribute('text-anchor', 'end'); labelHigh.setAttribute('class', 'chart-placeholder');
        labelHigh.textContent = '高';
        svg.appendChild(labelHigh);
        var labelLow = document.createElementNS(ns, 'text');
        labelLow.setAttribute('x', xStart - 6); labelLow.setAttribute('y', yBase + 4);
        labelLow.setAttribute('text-anchor', 'end'); labelLow.setAttribute('class', 'chart-placeholder');
        labelLow.textContent = '低';
        svg.appendChild(labelLow);
        var placeholder = document.createElementNS(ns, 'text');
        placeholder.setAttribute('x', CHART_CONFIG.VIEWBOX_W / 2);
        placeholder.setAttribute('y', CHART_CONFIG.VIEWBOX_H / 2);
        placeholder.setAttribute('text-anchor', 'middle'); placeholder.setAttribute('class', 'chart-placeholder');
        placeholder.textContent = CHART_CONFIG.PLACEHOLDER_TEXT;
        svg.appendChild(placeholder);
        return svg;
      }

      function buildChartSVG(nodes) {
        var ns = SVG_NS;
        var svg = document.createElementNS(ns, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + CHART_CONFIG.VIEWBOX_W + ' ' + CHART_CONFIG.VIEWBOX_H);
        svg.setAttribute('class', 'chart-svg');
        var yBase = CHART_CONFIG.VIEWBOX_H - CHART_CONFIG.PADDING_BOTTOM;
        var yPeak = CHART_CONFIG.PADDING_TOP;
        var xStart = CHART_CONFIG.PADDING_LEFT;
        var xEnd = CHART_CONFIG.VIEWBOX_W - CHART_CONFIG.PADDING_RIGHT;
        var plotW = xEnd - xStart;
        var days = nodes.map(function (n) { return n.daysAfterSowing; }).filter(function (d) { return d != null; });
        if (days.length === 0) return buildEmptyChartSVG();
        var minDay = Math.min.apply(null, days);
        var maxDay = Math.max.apply(null, days);
        if (maxDay === minDay) maxDay = minDay + 1;
        var axisY = document.createElementNS(ns, 'line');
        axisY.setAttribute('x1', xStart); axisY.setAttribute('y1', yPeak);
        axisY.setAttribute('x2', xStart); axisY.setAttribute('y2', yBase);
        axisY.setAttribute('class', 'chart-axis');
        svg.appendChild(axisY);
        var axisX = document.createElementNS(ns, 'line');
        axisX.setAttribute('x1', xStart); axisX.setAttribute('y1', yBase);
        axisX.setAttribute('x2', xEnd); axisX.setAttribute('y2', yBase);
        axisX.setAttribute('class', 'chart-axis');
        svg.appendChild(axisX);
        var sigma = CHART_CONFIG.SIGMA;
        var d = '';
        nodes.forEach(function (n) {
          if (n.daysAfterSowing == null) return;
          var cx = xStart + (n.daysAfterSowing - minDay) / (maxDay - minDay) * plotW;
          d += gaussianPath(cx, sigma, xStart, xEnd, yBase, yPeak);
        });
        if (d) {
          var path = document.createElementNS(ns, 'path');
          path.setAttribute('d', d);
          path.setAttribute('class', 'chart-curve');
          svg.appendChild(path);
        }
        var labelHigh = document.createElementNS(ns, 'text');
        labelHigh.setAttribute('x', xStart - 6); labelHigh.setAttribute('y', yPeak + 8);
        labelHigh.setAttribute('text-anchor', 'end'); labelHigh.setAttribute('class', 'chart-placeholder');
        labelHigh.textContent = '高';
        svg.appendChild(labelHigh);
        var labelLow = document.createElementNS(ns, 'text');
        labelLow.setAttribute('x', xStart - 6); labelLow.setAttribute('y', yBase + 4);
        labelLow.setAttribute('text-anchor', 'end'); labelLow.setAttribute('class', 'chart-placeholder');
        labelLow.textContent = '低';
        svg.appendChild(labelLow);
        return svg;
      }

      function renderChart(data) {
        var chart = document.getElementById('chart');
        chart.innerHTML = '';
        var nodes = (data && Array.isArray(data.nodes)) ? data.nodes : [];
        var hasRealData = nodes.some(function (n) { return n.date != null || n.name != null; });
        var hasValidDays = nodes.some(function (n) { return n.daysAfterSowing != null; });
        var svg = (hasRealData && hasValidDays) ? buildChartSVG(nodes) : buildEmptyChartSVG();
        chart.appendChild(svg);
        chartRendered = true;
      }

      function renderModeSwitch() {
        var sw = document.getElementById('mode-switch');
        sw.hidden = false;
        sw.querySelectorAll('.mode-tab').forEach(function (tab) {
          tab.addEventListener('click', function () { switchMode(this.getAttribute('data-mode')); });
        });
      }

      function switchMode(mode) {
        if (mode !== 'node' && mode !== 'chart') return;
        currentMode = mode;
        var sw = document.getElementById('mode-switch');
        sw.querySelectorAll('.mode-tab').forEach(function (tab) {
          if (tab.getAttribute('data-mode') === mode) tab.classList.add('active');
          else tab.classList.remove('active');
        });
        document.getElementById('timeline').hidden = (mode !== 'node');
        document.getElementById('chart').hidden = (mode !== 'chart');
        if (mode === 'chart' && !chartRendered) renderChart(cachedData);
      }

      function render(data) {
        document.getElementById('loading').hidden = true;
        if (!data || typeof data !== 'object') data = { todayConclusion: {}, nodes: [] };
        if (!Array.isArray(data.nodes)) data = { todayConclusion: data.todayConclusion || {}, nodes: [] };
        if (data.nodes.length === 0) {
          document.getElementById('empty-state').hidden = false;
          return;
        }
        renderConclusion(data);
        cachedData = data;
        renderModeSwitch();
        var timeline = document.getElementById('timeline');
        timeline.innerHTML = '';
        data.nodes.forEach(function (n) { timeline.appendChild(renderNode(n)); });
        var reminders = Array.isArray(data.reminders) ? data.reminders : [];
        reminders.forEach(function (r) {
          if (r && (r.festivalName || r.festivalDate || r.reminderCopy)) {
            timeline.appendChild(renderReminder(r));
          }
        });
        timeline.hidden = false;
        document.getElementById('footer').hidden = false;
      }

      getData().then(render);
    })();
  </script>
</body>
</html>
