<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var t=localStorage.getItem('agritime.theme')||'system';var d=(t==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t);document.documentElement.setAttribute('data-theme',d);document.documentElement.style.colorScheme=d;}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7f5" />
  <title>客服工单 · 知农时超管后台</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/common-logo.svg" />
  <link rel="stylesheet" href="../assets/css/common.css" />
  <link rel="stylesheet" href="../assets/css/admin-console.css" />
  <link rel="stylesheet" href="../assets/css/service.css" />
  <link rel="stylesheet" href="../assets/css/admin-tickets.css" />
  <link rel="stylesheet" href="../assets/css/theme-dark.css" />
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="admin-brand">
      <img src="../assets/img/common-logo.svg" width="24" height="24" alt="" aria-hidden="true" />
      <span>知农时 · 客服工单</span>
    </div>
    <span class="admin-who" id="ticket-who"></span>
    <a class="admin-back" href="./admin.html">返回后台</a>
    <a class="admin-back" href="./index.html">返回主页</a>
  </header>

  <main class="admin-main">

    <section class="admin-gate" id="ticket-gate" hidden>
      <h1>需要管理员权限</h1>
      <p id="ticket-gate-text">请用超管账号登录后查看。</p>
      <a class="admin-btn" href="./auth.html?next=admin-tickets.html">去登录</a>
    </section>

    <section id="ticket-content" hidden>
      <div class="ticket-head">
        <div>
          <h1 class="ticket-title">客服工单</h1>
          <p class="ticket-sub">按状态排队处理；回复或改状态后，用户端会看到未读与最新进展。</p>
        </div>
      </div>

      <div class="ticket-stats" id="ticket-stats"></div>

      <div class="ticket-toolbar">
        <nav class="service-tabs" id="ticket-tabs" role="tablist">
          <button type="button" class="service-tab is-active" data-status="all">全部 <span data-count="all">0</span></button>
          <button type="button" class="service-tab" data-status="open">待处理 <span data-count="open">0</span></button>
          <button type="button" class="service-tab" data-status="processing">处理中 <span data-count="processing">0</span></button>
          <button type="button" class="service-tab" data-status="resolved">已解决 <span data-count="resolved">0</span></button>
        </nav>
        <span class="service-unread" id="ticket-unread" hidden></span>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table ticket-table" id="ticket-table">
          <thead>
            <tr>
              <th>主题</th>
              <th>用户</th>
              <th>分类</th>
              <th>状态</th>
              <th>最后回复</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ticket-body"></tbody>
        </table>
        <div class="admin-empty" id="ticket-empty" hidden></div>
      </div>

      <div class="service-pager" id="ticket-pager" hidden>
        <button type="button" class="service-page-btn" id="ticket-prev">上一页</button>
        <span class="service-page-info" id="ticket-page-info"></span>
        <button type="button" class="service-page-btn" id="ticket-next">下一页</button>
      </div>
    </section>

  </main>

  <div class="ticket-mask" id="ticket-mask" hidden></div>

  <aside class="ticket-detail" id="ticket-detail" hidden aria-label="工单详情">
    <div class="ticket-detail-head">
      <div>
        <div class="ticket-detail-subject" id="ticket-detail-subject"></div>
        <div class="ticket-detail-meta" id="ticket-detail-meta"></div>
      </div>
      <button type="button" class="ticket-detail-close" id="ticket-detail-close" aria-label="关闭">×</button>
    </div>
    <div class="ticket-thread" id="ticket-thread"></div>
    <div class="ticket-actions" id="ticket-actions"></div>
    <div class="service-reply-box ticket-reply-box">
      <textarea id="ticket-reply" rows="3" placeholder="回复用户…"></textarea>
      <button type="button" class="admin-btn" id="ticket-reply-btn">发送</button>
    </div>
  </aside>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/ui-state.js"></script>
  <script src="../assets/js/admin-tickets.js"></script>
</body>
</html>
