<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe3" />
  <title>知农时</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/common-logo.svg" />

<body data-layout="app">

  <div id="loading-gate">
    <div class="loading-gate-spinner"></div>
    <span class="loading-gate-text">加载中…</span>
  </div>

  <button class="sidebar-burger" id="sidebar-burger" aria-label="菜单">☰</button>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">知农时</div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <div class="app-main">
  <main class="page page--home">
    <header class="brand">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">
          <img class="brand-logo" src="../assets/img/common-logo.svg" width="24" height="24" alt="" aria-hidden="true" />
        </span>
        <div>
          <div class="brand-name">知农时</div>

        </div>
      </div>
    </header>

    <div class="weather-bg-layer" id="weather-bg-layer" aria-hidden="true"></div>
    <div class="weather-card" id="weather-card" data-weather="default" data-season="auto" hidden>
      <span class="weather-loc" id="weather-loc">--</span>
      <span class="weather-temp" id="weather-temp">--°</span>
      <span class="weather-desc" id="weather-desc">--</span>
      <span class="weather-extra" id="weather-extra">--</span>
    </div>


    <div class="term-ruler" id="term-ruler" aria-hidden="true"></div>

    <form class="card" id="timeline-form" novalidate>
      <div class="field" id="field-crop">
        <label for="crop">作物品种</label>
        <input id="crop" name="crop" type="text" autocomplete="off" />
        <div class="suggestions" id="crop-suggestions"></div>
        <div class="error" id="error-crop">请输入作物品种</div>
      </div>

      <div class="field" id="field-sowing-date">
        <label>播种日期</label>
        <div class="date-picker" id="date-picker" title="可选范围：两年前至今天后 10 天" aria-label="可选范围：两年前至今天后 10 天">
          <select id="date-year" aria-label="年"></select>
          <select id="date-month" aria-label="月"></select>
          <select id="date-day" aria-label="日"></select>
          <input id="sowingDate" name="sowingDate" type="hidden" />
        </div>
        <p class="date-range-hint" id="date-range-hint">请选择两年前至今天后 10 天的日期</p>
        <div class="error" id="error-sowingDate">播种日期不能晚于今天</div>
      </div>

      <div class="field" id="field-location">
        <label for="location">所在地</label>
        <input id="location" name="location" type="text" autocomplete="off" placeholder="" />
        <button type="button" class="map-picker-btn" id="map-picker-btn" aria-label="地图标点">📍</button>
        <div class="error" id="error-location">请输入所在地</div>
      </div>

      <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        生成时间线
      </button>
      <div class="photo-channels">
        <button type="button" class="btn btn-ghost" id="photo-btn">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h3l1.4-2h7.2L17 8h3v11H4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.7"/></svg>
          拍照
        </button>
        <button type="button" class="btn btn-ghost" id="upload-btn">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 20h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          上传 / 选图
        </button>
      </div>
      <p class="photo-entry">识别只给候选，需你点一下确认</p>
      <div class="toast" id="toast"></div>
    </form>

    <div class="history hidden" id="history">
      <div class="history-head">
        <span class="history-title">最近查询</span>
        <button type="button" class="history-clear" id="history-clear">清空</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </main>
  </div>

  <div class="content-pane" data-module="calendar" id="calendar-pane">
    <div id="module-placeholder"></div>
  </div>

  <div class="content-pane" data-module="recommend" id="recommend-pane">
    <div class="recommend-pane">
      <div class="recommend-header">
        <span class="recommend-title">种植推荐</span>
        <span class="recommend-sub">选择时间和地点，综合节气、气候、市场推荐适宜作物</span>
      </div>
      <form class="recommend-form" id="recommend-form">
        <div class="field">
          <label for="recommend-month">种植月份</label>
          <select id="recommend-month"></select>
        </div>
        <div class="field">
          <label for="recommend-location">地点 <span class="hint">城市或地区名</span></label>
          <input type="text" id="recommend-location" placeholder="如：山东济宁" />
        </div>
        <div class="field">
          <label for="recommend-lat">纬度 <span class="hint">可选</span></label>
          <input type="text" id="recommend-lat" value="35.07" />
        </div>
        <div class="field">
          <label for="recommend-lon">经度 <span class="hint">可选</span></label>
          <input type="text" id="recommend-lon" value="116.31" />
        </div>
        <div class="field">
          <label>定位</label>
          <div class="recommend-loc-row">
            <button type="button" class="btn btn-ghost" id="recommend-loc-btn">📍 自动定位</button>
            <span class="recommend-loc-status" id="recommend-loc-status"></span>
          </div>
        </div>
        <div class="recommend-submit-row">
          <button type="submit" class="btn btn-primary">获取推荐</button>
        </div>
      </form>
      <div id="recommend-result"></div>
    </div>
  </div>

  <div class="content-pane" data-module="my-crops" id="my-crops-pane">
    <div class="my-crops-pane">
      <div class="my-crops-header">
        <div class="pane-head-text"><span class="my-crops-title">我的作物</span><span class="pane-sub">已经种下的作物，拍照记录长势</span></div>
      </div>
      <div id="my-crops-list"></div>
    </div>
  </div>

  <div class="content-pane" data-module="plots" id="plots-pane">
    <div class="my-plots-pane">
      <div class="my-plots-header">
        <div class="pane-head-text"><span class="my-plots-title">我的地块</span><span class="pane-sub">记录田地、大棚、鱼塘，查看实时环境与周边水体</span></div>
        <button type="button" class="my-plots-add" id="my-plots-add-btn">+ 添加地块</button>
      </div>
      <form class="my-plots-form" id="my-plots-form">
        <h3>地块信息</h3>
        <input type="hidden" name="plot-id" />
        <div class="field">
          <label>地块名称</label>
          <input type="text" name="plot-name" placeholder="如：东边麦田" required />
        </div>
        <div class="field">
          <label>地块种类</label>
          <select name="plot-type">
            <option value="farmland">耕田</option>
            <option value="economic">经济作物田</option>
            <option value="greenhouse">大棚</option>
            <option value="fishpond">鱼塘</option>
            <option value="orchard">果园</option>
            <option value="paddy">水稻田</option>
          </select>
        </div>
        <div class="field">
          <label>所在地 <span class="hint">支持自动定位/地图选点/文字搜索</span></label>
          <div class="my-plots-loc-row">
            <input type="text" name="plot-location" id="plot-location" placeholder="点击右侧按钮定位" />
          </div>
          <div class="my-plots-loc-btns" style="margin-top:8px;">
            <button type="button" id="plot-loc-auto">📍 自动定位</button>
            <button type="button" id="plot-loc-map">🗺️ 地图选点</button>
          </div>
          <input type="hidden" name="plot-lat" id="plot-lat" />
          <input type="hidden" name="plot-lon" id="plot-lon" />
        </div>
        <div class="my-plots-form-row">
          <div class="field">
            <label>形状</label>
            <select name="plot-shape">
              <option value="rectangle">方形</option>
              <option value="strip">条状</option>
              <option value="irregular">不规则</option>
            </select>
          </div>
          <div class="field">
            <label>面积（亩）</label>
            <input type="number" name="plot-area" min="0" step="0.1" placeholder="0" />
          </div>
        </div>
        <div class="my-plots-form-row">
          <div class="field">
            <label>倾角（°）</label>
            <input type="number" name="plot-angle" min="0" max="90" step="1" value="0" />
          </div>
          <div class="field">
            <label>坡度（°）</label>
            <input type="number" name="plot-slope" min="0" max="90" step="1" value="0" />
          </div>
        </div>
        <div class="field">
          <label><input type="checkbox" name="plot-terrace" style="width:auto;margin-right:6px;" /> 梯田</label>
        </div>
        <div class="field">
          <label>备注</label>
          <textarea name="plot-remark" placeholder="补充说明…"></textarea>
        </div>
        <div class="my-plots-form-actions">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-ghost" id="my-plots-cancel">取消</button>
        </div>
      </form>
      <div class="my-plots-detail" id="my-plots-detail"></div>
      <div id="my-plots-list"></div>
    </div>
  </div>

  <div class="content-pane" data-module="disease" id="disease-pane">
    <div class="disease-pane">
      <div class="disease-header">
        <span class="disease-title">病害检查</span>
        <span class="disease-sub">描述症状或拍照上传，给出判断与应对策略</span>
      </div>

      <div class="disease-body">
      <form class="disease-form" id="disease-form">
        <div class="field">
          <label for="disease-crop">作物</label>
          <select id="disease-crop" name="crop">
            <option value="">不确定（在全部作物里找）</option>
            <option value="番茄">番茄</option>
            <option value="大蒜">大蒜</option>
            <option value="小麦">小麦</option>
            <option value="玉米">玉米</option>
            <option value="水稻">水稻</option>
            <option value="大豆">大豆</option>
            <option value="辣椒">辣椒</option>
            <option value="棉花">棉花</option>
          </select>
        </div>
        <div class="field">
          <label for="disease-text">症状描述 <span class="hint">写清楚部位、颜色，有没有霉层或虫子</span></label>
          <textarea id="disease-text" name="q" rows="3"
            placeholder="例：叶片上有褐色斑点，边缘不清晰，湿度大时叶背有白色霉层"></textarea>
        </div>
        <div class="disease-photo-row">
          <input type="file" id="disease-photo" accept="image/*" class="hidden" />
          <button type="button" class="btn btn-ghost" id="disease-photo-btn">📷 拍照 / 选图</button>
          <span class="disease-photo-name" id="disease-photo-name"></span>
        </div>
        <p class="disease-tip">图片暂不参与识别，只做留档；判断依据是上面的文字描述。</p>
        <div class="disease-actions">
          <button type="submit" class="btn btn-primary">开始判断</button>
          <button type="button" class="btn btn-ghost" id="disease-reset">清空</button>
        </div>
      </form>

      <div id="disease-result"></div>
      </div>
    </div>
  </div>

  <div class="content-pane" data-module="service" id="service-pane">
    <div class="service-pane">
      <div class="service-header">
        <div>
          <span class="service-title">在线客服</span>
          <span class="service-sub">有问题随时提问，客服会尽快回复</span>
        </div>
        <button type="button" class="btn btn-primary service-new-btn" id="service-new-btn">+ 新建咨询</button>
      </div>
      <button type="button" class="btn btn-ghost service-back-btn" id="service-back-btn" style="display:none;margin-bottom:10px;">← 返回列表</button>
      <div id="service-list"></div>
      <form class="service-form" id="service-form" style="display:none;">
        <div class="field">
          <label for="service-user-name">您的称呼 <span class="hint">选填，方便客服称呼您</span></label>
          <input type="text" id="service-user-name" placeholder="如：老李" />
        </div>
        <div class="field">
          <label for="service-subject">问题标题</label>
          <input type="text" id="service-subject" placeholder="一句话概括您的问题" required />
        </div>
        <div class="field">
          <label for="service-category">问题类别</label>
          <select id="service-category">
            <option value="种植技术">种植技术</option>
            <option value="病虫害">病虫害</option>
            <option value="天气农事">天气农事</option>
            <option value="地块管理">地块管理</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="field">
          <label for="service-content">问题描述</label>
          <textarea id="service-content" rows="4" placeholder="详细描述您遇到的问题…" required></textarea>
        </div>
        <div class="service-form-actions">
          <button type="submit" class="btn btn-primary">提交工单</button>
        </div>
      </form>
      <div id="service-detail" style="display:none;"></div>
    </div>

  <script>
    document.addEventListener('weather-ready', function () {
      var gate = document.getElementById('loading-gate');
      if (gate) gate.classList.add('hidden');
    });
    setTimeout(function () {
      var gate = document.getElementById('loading-gate');
      if (gate && !gate.classList.contains('hidden')) gate.classList.add('hidden');
    }, 3000);
  </script>
  <script>
    (function () {
      var CROPS = window.CropMap.CROPS;

      var form = document.getElementById('timeline-form');
      var cropInput = document.getElementById('crop');
      var sowingInput = document.getElementById('sowingDate');
      var locationInput = document.getElementById('location');
      var suggestions = document.getElementById('crop-suggestions');
      var toast = document.getElementById('toast');
      var historyBox = document.getElementById('history');
      var historyList = document.getElementById('history-list');
      var historyClear = document.getElementById('history-clear');

      var RANGE_BACK_DAYS = 730; /* @deprecated 改用 MIN_YEAR_OFFSET，保留以兼容既有测试断言 */
      var MIN_YEAR_OFFSET = 2;
      var MAX_FUTURE_DAYS = 10;
      var RANGE_HINT_TEXT = '请选择两年前至今天后 10 天的日期';
      var RANGE_HINT_TITLE = '可选范围：两年前至今天后 10 天';
      var DEFAULT_BACK_DAYS = 150;
      var SUGGEST_DEBOUNCE_MS = 80;
      var yearSel = document.getElementById('date-year');
      var monthSel = document.getElementById('date-month');
      var daySel = document.getElementById('date-day');

      function pad2(n) { return String(n).padStart(2, '0'); }
      function dateToStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
      function calcMinSelectableDate(today) {
        today = today || new Date();
        if (isNaN(today.getFullYear())) { var d = new Date(); d.setDate(d.getDate() - RANGE_BACK_DAYS); return d; }
        var result = new Date(today.getFullYear() - MIN_YEAR_OFFSET, today.getMonth(), today.getDate());
        if (result.getMonth() !== today.getMonth()) {
          result = new Date(today.getFullYear() - MIN_YEAR_OFFSET, today.getMonth() + 1, 0);
        }
        return result;
      }
      function getMaxDate() { var d = new Date(); d.setDate(d.getDate() + MAX_FUTURE_DAYS); return d; }
      function getMinDate() { return calcMinSelectableDate(new Date()); }
      function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

      function fillYears() {
        var minD = getMinDate(), maxD = getMaxDate();
        yearSel.innerHTML = '<option value="">年</option>';
        for (var y = minD.getFullYear(); y <= maxD.getFullYear(); y += 1) {
          var o = document.createElement('option');
          o.value = y; o.textContent = y + '年';
          yearSel.appendChild(o);
        }
      }

      function fillMonths() {
        var minD = getMinDate(), maxD = getMaxDate();
        var y = Number(yearSel.value);
        monthSel.innerHTML = '<option value="">月</option>';
        if (!y) return;
        for (var m = 1; m <= 12; m += 1) {
          var o = document.createElement('option');
          o.value = m; o.textContent = m + '月';
          o.disabled = (y === minD.getFullYear() && m < minD.getMonth() + 1) || (y === maxD.getFullYear() && m > maxD.getMonth() + 1);
          if (o.disabled) o.title = RANGE_HINT_TEXT;
          monthSel.appendChild(o);
        }
      }

      function fillDays() {
        var minD = getMinDate(), maxD = getMaxDate();
        var y = Number(yearSel.value), m = Number(monthSel.value);
        daySel.innerHTML = '<option value="">日</option>';
        if (!y || !m) return;
        var days = daysInMonth(y, m - 1);
        for (var d = 1; d <= days; d += 1) {
          var o = document.createElement('option');
          o.value = d; o.textContent = d + '日';
          o.disabled = (y === minD.getFullYear() && m === minD.getMonth() + 1 && d < minD.getDate()) || (y === maxD.getFullYear() && m === maxD.getMonth() + 1 && d > maxD.getDate());
          if (o.disabled) o.title = RANGE_HINT_TEXT;
          daySel.appendChild(o);
        }
      }

      function clampDay() {
        var y = Number(yearSel.value), m = Number(monthSel.value), d = Number(daySel.value);
        if (!y || !m || !d) return;
        var days = daysInMonth(y, m - 1);
        if (d > days) daySel.value = days;
      }

      function composeDate() {
        var y = yearSel.value, m = monthSel.value, d = daySel.value;
        sowingInput.value = (y && m && d) ? y + '-' + pad2(m) + '-' + pad2(d) : '';
      }

      function syncSelectsFromDate(s) {
        if (!s) { yearSel.value = ''; fillMonths(); fillDays(); return; }
        var p = s.split('-');
        yearSel.value = p[0];
        fillMonths();
        monthSel.value = Number(p[1]);
        fillDays();
        daySel.value = Number(p[2]);
        clampDay();
      }

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function renderRuler() {
        var ruler = document.getElementById('term-ruler');
        for (var i = 0; i < 24; i += 1) {
          var tick = document.createElement('i');
          if (i % 6 === 0) tick.className = 'hi';
          ruler.appendChild(tick);
        }
      }

      function setDefaultValues() {


        syncSelectsFromDate(sowingInput.value);
      }

      var suggestHits = [];
      var suggestActive = -1;
      var suggestTimer = null;

      function highlight(name, kw) {
        if (!kw) return document.createTextNode(name);
        var idx = name.indexOf(kw);
        if (idx === -1) return document.createTextNode(name);
        var frag = document.createDocumentFragment();
        frag.appendChild(document.createTextNode(name.slice(0, idx)));
        var hl = document.createElement('span');
        hl.className = 'hl';
        hl.textContent = name.slice(idx, idx + kw.length);
        frag.appendChild(hl);
        frag.appendChild(document.createTextNode(name.slice(idx + kw.length)));
        return frag;
      }

      function pickSuggestion(c) {
        cropInput.value = c.name;
        locationInput.value = c.city;
        suggestions.classList.remove('show');
        suggestHits = [];
        suggestActive = -1;
      }

      function renderSuggestions(keyword) {
        var kw = (keyword || '').trim();
        suggestions.innerHTML = '';
        suggestHits = [];
        suggestActive = -1;
        if (!kw) { suggestions.classList.remove('show'); return; }
        var matches = (window.CropMap && window.CropMap.matchCrop) ? window.CropMap.matchCrop(kw) : [];
        if (matches.length === 0) {
          var fallback = CROPS.filter(function (c) { return c.name.indexOf(kw) !== -1; });
          matches = fallback.map(function (c) { return c.name; });
        }
        if (matches.length === 0) { suggestions.classList.remove('show'); return; }
        suggestHits = matches.map(function (name) {
          var hit = findCrop(name);
          return { name: name, city: hit ? hit.city : '', lat: hit ? hit.lat : 35.07, lng: hit ? hit.lng : 116.31 };
        });
        suggestHits.forEach(function (c) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.appendChild(highlight(c.name, kw));
          btn.addEventListener('click', function () { pickSuggestion(c); });
          suggestions.appendChild(btn);
        });
        suggestions.classList.add('show');
      }

      function updateSuggestActive() {
        var btns = suggestions.querySelectorAll('button');
        Array.prototype.forEach.call(btns, function (b, i) {
          b.classList.toggle('active', i === suggestActive);
        });
      }

      function setInvalid(fieldId, invalid) {
        document.getElementById(fieldId).classList.toggle('invalid', invalid);
      }

      function showToast(msg, type) {
        toast.textContent = msg;
        toast.className = 'toast show ' + (type || 'info');
      }

      function findCrop(name) {
        return CROPS.filter(function (c) { return c.name === name; })[0];
      }

      function validate() {
        var ok = true;
        if (!cropInput.value.trim()) { setInvalid('field-crop', true); ok = false; } else { setInvalid('field-crop', false); }
        var dateErr = document.getElementById('error-sowingDate');
        var invalidDate = false;
        if (!sowingInput.value) {
          dateErr.textContent = '请选择播种日期';
          invalidDate = true;
        } else if (sowingInput.value > dateToStr(getMaxDate())) {
          dateErr.textContent = '播种日期不能晚于今天后 10 天';
          invalidDate = true;
        } else if (sowingInput.value < dateToStr(getMinDate())) {
          dateErr.textContent = '播种日期不能早于两年前';
          invalidDate = true;
        }
        setInvalid('field-sowing-date', invalidDate);
        if (invalidDate) ok = false;
        if (!locationInput.value.trim()) { setInvalid('field-location', true); ok = false; } else { setInvalid('field-location', false); }
        return ok;
      }

      yearSel.addEventListener('change', function () { fillMonths(); clampDay(); fillDays(); composeDate(); setInvalid('field-sowing-date', false); });
      monthSel.addEventListener('change', function () { clampDay(); fillDays(); composeDate(); setInvalid('field-sowing-date', false); });
      daySel.addEventListener('change', function () { composeDate(); setInvalid('field-sowing-date', false); });

      cropInput.addEventListener('input', function () {
        setInvalid('field-crop', false);
        if (suggestTimer) clearTimeout(suggestTimer);
        suggestTimer = setTimeout(function () { renderSuggestions(cropInput.value); }, SUGGEST_DEBOUNCE_MS);
      });
      cropInput.addEventListener('keydown', function (e) {
        if (!suggestions.classList.contains('show') || suggestHits.length === 0) return;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          suggestActive = (suggestActive + 1) % suggestHits.length;
          updateSuggestActive();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          suggestActive = (suggestActive - 1 + suggestHits.length) % suggestHits.length;
          updateSuggestActive();
        } else if (e.key === 'Enter') {
          if (suggestActive >= 0) { e.preventDefault(); pickSuggestion(suggestHits[suggestActive]); }
        } else if (e.key === 'Escape') {
          suggestions.classList.remove('show');
        }
      });
      cropInput.addEventListener('blur', function () { setTimeout(function () { suggestions.classList.remove('show'); }, 150); });

      function openPhoto(prefer) {
        if (window.PhotoCapture) {
          window.PhotoCapture.open(function (cropName) {
            cropInput.value = cropName;
            var hit = findCrop(cropName);
            if (hit) { locationInput.value = hit.city; }
            showToast('已确认品种：' + cropName, 'info');
          }, prefer);
        }
      }

      document.getElementById('photo-btn').addEventListener('click', function () { openPhoto('capture'); });
      document.getElementById('upload-btn').addEventListener('click', function () { openPhoto('upload'); });

      function renderHistory() {
        if (!window.HistoryStore) { historyBox.classList.add('hidden'); return; }
        var items = window.HistoryStore.list();
        historyList.innerHTML = '';
        if (!items.length) { historyBox.classList.add('hidden'); return; }
        items.forEach(function (it, idx) {
          var row = document.createElement('div');
          row.className = 'history-row';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'history-item';
          var label = [it.cropName, it.sowDate, it.location].filter(Boolean).join(' · ');
          btn.textContent = label || '未命名';
          btn.addEventListener('click', function () {
            if (it.cropName) cropInput.value = it.cropName;
            if (it.location) locationInput.value = it.location;
            if (it.sowDate) { syncSelectsFromDate(it.sowDate); composeDate(); }
            historyBox.classList.add('hidden');
          });
          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'history-del';
          del.textContent = '×';
          del.setAttribute('aria-label', '删除此条');
          del.addEventListener('click', function (e) {
            e.stopPropagation();
            window.HistoryStore.remove(idx);
            renderHistory();
          });
          row.appendChild(btn);
          row.appendChild(del);
          historyList.appendChild(row);
        });
        historyBox.classList.remove('hidden');
      }

      cropInput.addEventListener('focus', function () {
        if (!cropInput.value.trim() && window.HistoryStore && window.HistoryStore.list().length) {
          renderHistory();
        }
      });
      cropInput.addEventListener('input', function () {
        if (cropInput.value.trim()) historyBox.classList.add('hidden');
      });

      historyClear.addEventListener('click', function () {
        if (window.HistoryStore) window.HistoryStore.clear();
        renderHistory();
      });

      function resolveTimelineUrl() {
        // 交给 page-url.js：会折叠双斜杠并返回绝对路径，
        // 避免 http://host// 这种地址下拼出 "//timeline.html" 被当成主机名
        if (window.PageUrl) return window.PageUrl.timelineUrl(location.pathname);
        return '/timeline.html';
      }

      function buildTimelineQuery(opts) {
        var params = new URLSearchParams();
        params.set('crop', window.CropMap.buildCropParam(opts.cropName));
        params.set('sowDate', opts.sowDate);
        params.set('lat', String(opts.lat));
        params.set('lon', String(opts.lon));
        params.set('location', opts.location || '');
        return params.toString();
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!validate()) { showToast('请先补全并检查表单', 'error'); return; }
        var cropName = cropInput.value.trim();
        var location = locationInput.value.trim();
        var sowDate = sowingInput.value;
        var hit = findCrop(cropName);
        if (window.HistoryStore) {
          window.HistoryStore.add({ cropName: cropName, sowDate: sowDate, location: location });
        }
        var query = buildTimelineQuery({
          cropName: cropName,
          sowDate: sowDate,
          lat: window.__markerLatLon ? window.__markerLatLon.lat : (hit ? hit.lat : 35.07),
          lon: window.__markerLatLon ? window.__markerLatLon.lon : (hit ? hit.lng : 116.31),
          location: location
        });
        try {
          var pane = document.getElementById('timeline-pane');
          var iframe = document.getElementById('timeline-iframe');
          var backBtn = document.getElementById('home-back');
          if (pane && iframe) {
            iframe.src = resolveTimelineUrl() + '?' + query;
            document.body.classList.add('split-active');
            pane.style.display = 'block';
            if (backBtn) backBtn.style.display = 'inline-block';
            return;
          }
        } catch (err) { /* 降级回退整页跳转 */ }
        window.location.href = resolveTimelineUrl() + '?' + query;
      });

      fillYears();
      renderRuler();
      setDefaultValues();
      renderHistory();
    })();
  </script>
</body>
</html>
