<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe3" />
  <title>知农时</title>
  <link rel="stylesheet" href="../assets/css/common.css" />
</head>
<body>
  <main class="page page--home">
    <header class="brand">
      <div class="brand-row">
        <span class="brand-mark" aria-hidden="true">
          <img class="brand-logo" src="../assets/img/common-logo.svg" width="24" height="24" alt="" aria-hidden="true" />
        </span>
        <div>
          <div class="brand-name">知农时</div>

        </div>
      </div>
    </header>


    <div class="term-ruler" id="term-ruler" aria-hidden="true"></div>

    <form class="card" id="timeline-form" novalidate>
      <div class="field" id="field-crop">
        <label for="crop">作物品种</label>
        <input id="crop" name="crop" type="text" autocomplete="off" />
        <div class="suggestions" id="crop-suggestions"></div>
        <div class="error" id="error-crop">请输入作物品种</div>
      </div>

      <div class="field" id="field-sowing-date">
        <label>播种日期</label>
        <div class="date-picker" id="date-picker">
          <select id="date-year" aria-label="年"></select>
          <select id="date-month" aria-label="月"></select>
          <select id="date-day" aria-label="日"></select>
          <input id="sowingDate" name="sowingDate" type="hidden" />
        </div>
        <div class="error" id="error-sowingDate">播种日期不能晚于今天</div>
      </div>

      <div class="field" id="field-location">
        <label for="location">所在地</label>
        <input id="location" name="location" type="text" autocomplete="off" placeholder="" />
        <div class="error" id="error-location">请输入所在地</div>
      </div>

      <button type="submit" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        生成时间线
      </button>
      <button type="button" class="btn btn-ghost" id="photo-btn">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8h3l1.4-2h7.2L17 8h3v11H4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.7"/></svg>
        说不清品种？拍一张照片
      </button>
      <p class="photo-entry">识别只给候选，需你点一下确认</p>
      <div class="toast" id="toast"></div>
    </form>
  </main>

  <script src="../assets/mock/mock-data.js"></script>
  <script src="../assets/js/crop-map.js"></script>
  <script src="photo-capture.js"></script>
  <script>
    (function () {
      var CROPS = window.CropMap.CROPS;

      var form = document.getElementById('timeline-form');
      var cropInput = document.getElementById('crop');
      var sowingInput = document.getElementById('sowingDate');
      var locationInput = document.getElementById('location');
      var suggestions = document.getElementById('crop-suggestions');
      var toast = document.getElementById('toast');

      var RANGE_BACK_DAYS = 730;
      var DEFAULT_BACK_DAYS = 150;
      var yearSel = document.getElementById('date-year');
      var monthSel = document.getElementById('date-month');
      var daySel = document.getElementById('date-day');

      function pad2(n) { return String(n).padStart(2, '0'); }
      function dateToStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
      function getMinDate() { var d = new Date(); d.setDate(d.getDate() - RANGE_BACK_DAYS); return d; }
      function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

      function fillYears() {
        var minD = getMinDate(), maxD = new Date();
        yearSel.innerHTML = '<option value="">年</option>';
        for (var y = minD.getFullYear(); y <= maxD.getFullYear(); y += 1) {
          var o = document.createElement('option');
          o.value = y; o.textContent = y + '年';
          yearSel.appendChild(o);
        }
      }

      function fillMonths() {
        var minD = getMinDate(), maxD = new Date();
        var y = Number(yearSel.value);
        monthSel.innerHTML = '<option value="">月</option>';
        if (!y) return;
        for (var m = 1; m <= 12; m += 1) {
          var o = document.createElement('option');
          o.value = m; o.textContent = m + '月';
          o.disabled = (y === minD.getFullYear() && m < minD.getMonth() + 1) || (y === maxD.getFullYear() && m > maxD.getMonth() + 1);
          monthSel.appendChild(o);
        }
      }

      function fillDays() {
        var minD = getMinDate(), maxD = new Date();
        var y = Number(yearSel.value), m = Number(monthSel.value);
        daySel.innerHTML = '<option value="">日</option>';
        if (!y || !m) return;
        var days = daysInMonth(y, m - 1);
        for (var d = 1; d <= days; d += 1) {
          var o = document.createElement('option');
          o.value = d; o.textContent = d + '日';
          o.disabled = (y === minD.getFullYear() && m === minD.getMonth() + 1 && d < minD.getDate()) || (y === maxD.getFullYear() && m === maxD.getMonth() + 1 && d > maxD.getDate());
          daySel.appendChild(o);
        }
      }

      function clampDay() {
        var y = Number(yearSel.value), m = Number(monthSel.value), d = Number(daySel.value);
        if (!y || !m || !d) return;
        var days = daysInMonth(y, m - 1);
        if (d > days) daySel.value = days;
      }

      function composeDate() {
        var y = yearSel.value, m = monthSel.value, d = daySel.value;
        sowingInput.value = (y && m && d) ? y + '-' + pad2(m) + '-' + pad2(d) : '';
      }

      function syncSelectsFromDate(s) {
        if (!s) { yearSel.value = ''; fillMonths(); fillDays(); return; }
        var p = s.split('-');
        yearSel.value = p[0];
        fillMonths();
        monthSel.value = Number(p[1]);
        fillDays();
        daySel.value = Number(p[2]);
        clampDay();
      }

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function renderRuler() {
        var ruler = document.getElementById('term-ruler');
        for (var i = 0; i < 24; i += 1) {
          var tick = document.createElement('i');
          if (i % 6 === 0) tick.className = 'hi';
          ruler.appendChild(tick);
        }
      }

      function setDefaultValues() {


        syncSelectsFromDate(sowingInput.value);
      }

      function renderSuggestions(keyword) {
        var kw = (keyword || '').trim();
        suggestions.innerHTML = '';
        if (!kw) { suggestions.classList.remove('show'); return; }
        var hits = CROPS.filter(function (c) { return c.name.indexOf(kw) !== -1; });
        if (hits.length === 0) { suggestions.classList.remove('show'); return; }
        hits.forEach(function (c) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = c.name;
          btn.addEventListener('click', function () {
            cropInput.value = c.name;
            locationInput.value = c.city;
            suggestions.classList.remove('show');
          });
          suggestions.appendChild(btn);
        });
        suggestions.classList.add('show');
      }

      function setInvalid(fieldId, invalid) {
        document.getElementById(fieldId).classList.toggle('invalid', invalid);
      }

      function showToast(msg, type) {
        toast.textContent = msg;
        toast.className = 'toast show ' + (type || 'info');
      }

      function findCrop(name) {
        return CROPS.filter(function (c) { return c.name === name; })[0];
      }

      function validate() {
        var ok = true;
        if (!cropInput.value.trim()) { setInvalid('field-crop', true); ok = false; } else { setInvalid('field-crop', false); }
        var dateErr = document.getElementById('error-sowingDate');
        var invalidDate = false;
        if (!sowingInput.value) {
          dateErr.textContent = '请选择播种日期';
          invalidDate = true;
        } else if (sowingInput.value > todayStr()) {
          dateErr.textContent = '播种日期不能晚于今天';
          invalidDate = true;
        } else if (sowingInput.value < dateToStr(getMinDate())) {
          dateErr.textContent = '播种日期不能早于两年前';
          invalidDate = true;
        }
        setInvalid('field-sowing-date', invalidDate);
        if (invalidDate) ok = false;
        if (!locationInput.value.trim()) { setInvalid('field-location', true); ok = false; } else { setInvalid('field-location', false); }
        return ok;
      }

      yearSel.addEventListener('change', function () { fillMonths(); clampDay(); fillDays(); composeDate(); setInvalid('field-sowing-date', false); });
      monthSel.addEventListener('change', function () { clampDay(); fillDays(); composeDate(); setInvalid('field-sowing-date', false); });
      daySel.addEventListener('change', function () { composeDate(); setInvalid('field-sowing-date', false); });

      cropInput.addEventListener('input', function () { renderSuggestions(cropInput.value); setInvalid('field-crop', false); });
      cropInput.addEventListener('blur', function () { setTimeout(function () { suggestions.classList.remove('show'); }, 150); });

      document.getElementById('photo-btn').addEventListener('click', function () {
        if (window.PhotoCapture) {
          window.PhotoCapture.open(function (cropName) {
            cropInput.value = cropName;
            var hit = findCrop(cropName);
            if (hit) { locationInput.value = hit.city; }
            showToast('已确认品种：' + cropName, 'info');
          });
        }
      });

      function buildTimelineQuery(opts) {
        var params = new URLSearchParams();
        params.set('crop', window.CropMap.buildCropParam(opts.cropName));
        params.set('sowDate', opts.sowDate);
        params.set('lat', String(opts.lat));
        params.set('lon', String(opts.lon));
        params.set('location', opts.location || '');
        return params.toString();
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!validate()) { showToast('请先补全并检查表单', 'error'); return; }
        var cropName = cropInput.value.trim();
        var hit = findCrop(cropName);
        window.location.href = 'timeline.html?' + buildTimelineQuery({
          cropName: cropName,
          sowDate: sowingInput.value,
          lat: hit ? hit.lat : 35.07,
          lon: hit ? hit.lng : 116.31,
          location: locationInput.value.trim()
        });
      });

      fillYears();
      renderRuler();
      setDefaultValues();
    })();
  </script>
</body>
</html>
