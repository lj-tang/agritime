# 骨架服务配置 —— 改这里不用改代码
#
# 优先级：环境变量 > 本文件 > 代码内置默认值
# 环境变量写法：把点换成下划线并大写，例如 server.port → SERVER_PORT
# 这样部署到 FunctionGraph 之后，用环境变量就能临时调参，不用重新打包。

server.port=8080

# 上游（天气/识别）超时阈值（毫秒）：超过这个时间就降级返回缓存。
# 实测国内访问 Open-Meteo 约 1~1.5s，800ms 会让真实天气永远降级，故演示环境用 2000；
# 部署后若网络条件不同，用环境变量 UPSTREAM_TIMEOUT_MS 调参，不用重新打包。
upstream.timeout.ms=5000

# 缓存有效期（秒）
cache.ttl.seconds=900

# 计算层是否还在用 mock。false = 真实调用 Open-Meteo；改回 true 可随时演练假数据与降级。
compute.mock=false

# 节点前后各取几天的天气窗口，用于打分
weather.window.days=3

# 【仅 mock 模式生效】人为制造上游延迟（毫秒），用来演练降级分支。
# 配合环境变量使用：MOCK_UPSTREAM_DELAY_MS=3000 UPSTREAM_TIMEOUT_MS=800 ./run.sh
# 就能稳定复现「上游超时 → 返回缓存 → 无缓存则明说取不到」。
mock.upstream.delay.ms=0
# 大模型配置 —— 华为云 MaaS 盘古大模型
# 当作物不在 crop-protocols.json 中时，调大模型动态生成农事规程
llm.api.url=https://api.modelarts-maas.com/v2/chat/completions
llm.api.key=
llm.model=openPangu-2.0-flash
llm.timeout.ms=60000
