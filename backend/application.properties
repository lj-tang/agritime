# 骨架服务配置 —— 改这里不用改代码
#
# 优先级：环境变量 > 本文件 > 代码内置默认值
# 环境变量写法：把点换成下划线并大写，例如 server.port → SERVER_PORT
# 这样部署到 FunctionGraph 之后，用环境变量就能临时调参，不用重新打包。

server.port=8080

# 上游（天气/识别）超时阈值（毫秒）：超过这个时间就降级返回缓存。
# 实测国内访问 Open-Meteo 约 1~1.5s，800ms 会让真实天气永远降级，故演示环境用 2000；
# 部署后若网络条件不同，用环境变量 UPSTREAM_TIMEOUT_MS 调参，不用重新打包。
upstream.timeout.ms=5000

# 缓存有效期（秒）
cache.ttl.seconds=900

# 计算层是否还在用 mock。false = 真实调用 Open-Meteo；改回 true 可随时演练假数据与降级。
compute.mock=false

# 节点前后各取几天的天气窗口，用于打分
weather.window.days=3

# 【仅 mock 模式生效】人为制造上游延迟（毫秒），用来演练降级分支。
# 配合环境变量使用：MOCK_UPSTREAM_DELAY_MS=3000 UPSTREAM_TIMEOUT_MS=800 ./run.sh
# 就能稳定复现「上游超时 → 返回缓存 → 无缓存则明说取不到」。
mock.upstream.delay.ms=0
# 大模型配置 —— 华为云 MaaS 盘古大模型
# 当作物不在 crop-protocols.json 中时，调大模型动态生成农事规程
#
# 密钥不入库：llm.api.key 留空，改由环境变量 LLM_API_KEY 注入
# （AppConfig.raw() 的规则：点换下划线转大写，环境变量优先级高于本文件）
# 服务器上写在 /etc/agritime.env（chmod 600），由 systemd 的 EnvironmentFile 加载；
# 本地开发时 export LLM_API_KEY=xxx 或直接在这一行临时填值，注意不要提交。
# 不配也能跑：大模型只是作物不在规程库时的兜底，缺 key 会自动回落到本地规程。
llm.api.url=https://api.modelarts-maas.com/v2/chat/completions
llm.api.key=
llm.model=openPangu-2.0-flash
llm.timeout.ms=60000

# 逆地理编码（地图标点 → 小区级中文地名）
#
# 前端直连 OpenStreetMap 的 Nominatim 在国内不可达（实测 10s 超时），
# 所以改由后端调用国内服务商，key 也只存在服务器上（/etc/agritime.env）。
# 环境变量：GEO_QQ_KEY / GEO_AMAP_KEY
#
# 两者都配时优先用腾讯（formatted_addresses.recommend 直接是小区级地址），
# 高德作为兜底（neighborhood / aois / pois 取小区与楼宇）。
# 都不配也能跑，只是标点拿不到地名（level=unknown），前端会提示手动输入。
geo.qq.key=
geo.amap.key=

# 账号系统（T10）
#
# 账号库是单个 JSON 文件，随写随落盘（原子替换），路径相对后端工作目录。
# 生产环境建议放到 /var/lib/agritime/users.json 并纳入备份。
auth.store.path=var/users.json

# 预置超管密码：只在账号库为空、首次建库时生效。
# 正式对外务必用环境变量 AUTH_ADMIN_PASSWORD 覆盖，别用这里的默认值。
auth.admin.password=

# 是否开放注册。对外收口时改成 false，只让超管建号。
auth.allow.register=true
